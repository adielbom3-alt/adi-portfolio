<style>/* Adi Elbom portfolio — shared styles */
:root {
  color-scheme: light;
  --paper: #FCFCFC;
  --white: #FFFFFF;
  --surface: #F5F5F6;
  --ink: #1F1F1F;
  --body: #46464D;
  --muted: #7A7A83;
  --line: #E6E6E9;
  --accent: #1573FE;          /* accent = Adi's brand blue */
  --accent-soft: #EAF1FF;
  --grid: #EEEEF1;            /* background grid lines (softer than --line) */
  --cell: 22px;               /* grid cell size; hero divider snaps to it */
  --marker: #FFE45C;          /* highlighter yellow for "Let's Connect." */
  --blue: #1573FE;            /* Adi's brand blue */

  --font: 'Red Hat Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'DM Mono', ui-monospace, Menlo, monospace;
  --font-logo: 'Song Myung', Georgia, serif;

  --maxw: 1180px;
  --text: 680px;
  --r: 8px;                   /* corner radius for frames and cards */
  box-sizing: border-box;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 96px; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--font); font-size: 16px; line-height: 1.6;
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
h1, h2, h3, p, figure, ul, ol, dl, dd { margin: 0; }
h1, h2, h3 { text-wrap: balance; font-weight: 600; letter-spacing: -0.03em; }
a { color: inherit; }
img { max-width: 100%; display: block; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
::selection { background: var(--blue); color: #fff; }
.wrap { max-width: var(--maxw); margin-inline: auto; padding-inline: clamp(16px, 4vw, 40px); }
.eyebrow { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

/* ---------- floating pill nav ---------- */
.navholder { position: sticky; top: 14px; z-index: 50; display: flex; justify-content: center; margin-top: 18px; padding-inline: 12px; pointer-events: none; }
nav.site {
  pointer-events: auto; display: flex; align-items: center; gap: 2px;
  background: rgba(255,255,255,0.85); backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4);
  border: 1px solid var(--line); border-radius: 999px;
  padding: 6px 6px 6px 26px; box-shadow: 0 6px 24px -16px rgba(20,20,25,0.3);
  max-width: 100%;
}
.brand { font-family: var(--font-logo); font-weight: 700; font-size: 1.05rem; text-decoration: none; margin-right: 28px; white-space: nowrap; }
.navlinks { display: flex; align-items: center; gap: 8px; }
.navlinks a { font-size: 0.9rem; font-weight: 500; color: var(--ink); padding: 9px 18px; border-radius: 999px; text-decoration: none; transition: color .2s, background .2s; white-space: nowrap; }
.navlinks > a:hover, .dd-trigger:hover, .nav-dd:hover .dd-trigger, .nav-dd.open .dd-trigger { color: var(--ink); background: var(--surface); }
.navlinks a.current { color: var(--ink); }
.navlinks a.cta { background: var(--ink); color: #fff; margin-left: 10px; }
.navlinks a.cta:hover { background: #000; color: #fff; }
/* Projects dropdown */
nav.site { position: relative; }
.nav-dd { display: flex; }
.dd-trigger { display: inline-flex !important; align-items: center; gap: 6px; }
.dd-trigger .chev { transition: transform .25s ease; }
.nav-dd:hover .chev, .nav-dd.open .chev { transform: rotate(180deg); }
.dd { position: absolute; top: 100%; left: 50%; width: min(300px, calc(100vw - 24px)); padding-top: 10px;
  opacity: 0; visibility: hidden; transform: translate(-50%, -4px); transition: opacity .2s ease, transform .2s ease, visibility 0s linear .2s; }
.dd::before { content: ""; position: absolute; inset: 10px 0 0; z-index: -1; background: #fff;
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--line); border-radius: 16px;
  box-shadow: 0 18px 40px -20px rgba(20,20,30,.28); }
.nav-dd:hover .dd, .nav-dd:focus-within .dd, .nav-dd.open .dd { opacity: 1; visibility: visible; transform: translate(-50%, 0); transition-delay: 0s; }
.navlinks .dd > a, .navlinks .dd > .dd-soon { display: grid; gap: 1px; padding: 10px 16px; margin: 6px; border-radius: 10px; text-decoration: none; color: var(--ink); font-size: 1rem; white-space: normal; }
.navlinks .dd > a + a, .navlinks .dd > a + .dd-soon { margin-top: -4px; }
.navlinks .dd > a:hover { background: var(--surface); }
.dd-title { font-size: .95rem; font-weight: 500; }
.dd-note { font-weight: 400; font-size: .8rem; }
.navlinks .dd > a.is-current { background: var(--surface); }
.navlinks .dd > a.is-current .dd-title::after { content: " ·  You’re here"; font-weight: 400; color: var(--muted); font-size: .8rem; }
.dd-soon { opacity: .5; cursor: default; }
@media (hover: none) { .nav-dd:hover .dd { opacity: 0; visibility: hidden; } .nav-dd.open .dd { opacity: 1; visibility: visible; } }

@media (max-width: 560px) {
  nav.site { padding-left: 16px; }
  .brand { font-size: .92rem; margin-right: 8px; }
  .navlinks { gap: 2px; }
  .navlinks a { padding: 7px 10px; font-size: .8rem; }
  .navlinks a.cta { margin-left: 4px; }
  .navlinks .hide-sm { display: none; }
}

/* ================= HOME ================= */
.home-frame { max-width: var(--maxw); margin-inline: auto; border-inline: 1px solid var(--line); }
.hero { position: relative; display: grid; grid-template-columns: 57.5% 1fr; grid-template-columns: round(down, 57.5%, var(--cell)) 1fr; border-bottom: 1px solid var(--line); margin-top: -64px; padding-top: 64px; }
.hero-text { padding: clamp(48px, 7vw, 96px) clamp(20px, 4vw, 56px) 112px; border-right: 1px solid var(--line); }
.hero-text .spark { width: 44px; height: 44px; margin-bottom: 26px; }
.spark svg { display: block; overflow: visible; }
.spark .s { fill: url(#gold); transform-box: fill-box; transform-origin: center; animation: twinkle 2.6s ease-in-out infinite; }
.spark .s2 { animation-delay: .5s; animation-duration: 2.2s; }
.spark .s3 { animation-delay: 1.1s; animation-duration: 2.9s; }
.spark .s1 { filter: drop-shadow(0 0 0 rgba(248,194,58,0)); animation-name: twinkle-main; }
@keyframes twinkle { 0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; } 45% { transform: scale(.55) rotate(25deg); opacity: .55; } 60% { transform: scale(1.12) rotate(0deg); opacity: 1; } }
@keyframes twinkle-main { 0%, 100% { transform: scale(1) rotate(0deg); filter: drop-shadow(0 0 0 rgba(248,194,58,0)); } 50% { transform: scale(1.1) rotate(12deg); filter: drop-shadow(0 0 6px rgba(248,194,58,.55)); } }
.spark:hover .s { animation-duration: .9s; }
@media (prefers-reduced-motion: reduce) { .spark .s { animation: none; } }
.hero-text h1 { font-weight: 300; font-size: clamp(1.9rem, 3.3vw, 2.65rem); line-height: 1.2; letter-spacing: -0.022em; max-width: 21ch; text-wrap: pretty; }
.hero-text h1 b { font-weight: 500; letter-spacing: -0.03em; }
.hero-text .nb { white-space: nowrap; }
@keyframes bob { 50% { transform: translateY(5px); } }
.scroll-btn { position: absolute; left: 50%; bottom: 28px; z-index: 5; display: inline-flex; align-items: center; gap: 8px;
  padding: 11px 20px; border-radius: 999px; background: rgba(255,255,255,.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--line); box-shadow: 0 12px 32px -12px rgba(21,115,254,.55), 0 2px 8px -4px rgba(21,115,254,.25);
  font-size: .92rem; font-weight: 500; color: var(--ink); text-decoration: none; white-space: nowrap;
  transform: translateX(-50%); animation: float 2.6s ease-in-out infinite; transition: background .2s; }
.scroll-btn span { color: var(--ink); font-size: 1.05rem; }
.scroll-btn:hover { background: var(--surface); }
.scroll-btn.gone { opacity: 0 !important; pointer-events: none; transition: opacity .35s ease; }
@keyframes float { 0%, 100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, -6px); } }
@media (prefers-reduced-motion: reduce) { .scroll-btn { animation: none; } }
.hero-photo { display: grid; place-items: center; padding: 40px; }
.hero-photo img { width: min(100%, 300px); height: auto; aspect-ratio: 1; object-fit: cover; border-radius: 6px; box-shadow: 0 20px 50px -30px rgba(0,0,0,.35); }
@media (max-width: 820px) {
  .hero { grid-template-columns: 1fr; }
  .hero-text { border-right: 0; border-bottom: 1px solid var(--line); }
  .hero-photo { display: none; }
  .hero-text { padding-top: 40px; }
}

.projects {
  padding: clamp(28px, 4vw, 56px) clamp(14px, 3vw, 48px);
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: var(--cell) var(--cell); background-position: -1px -1px;
  display: grid; gap: clamp(20px, 3vw, 32px);
}
.card { display: grid; grid-template-columns: 1.15fr 1fr; background: var(--white); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; text-decoration: none; transition: box-shadow .3s, transform .3s; }
a.card:hover { box-shadow: 0 14px 34px -22px rgba(20,20,30,.16), 0 2px 6px -3px rgba(20,20,30,.06); transform: translateY(-2px); }
.card-media { position: relative; overflow: hidden; min-height: clamp(280px, 30vw, 400px);
  background: var(--white); border-right: 1px solid var(--line); }
.card-media img { position: absolute; left: 11%; top: 13%; width: 120%; max-width: none; height: auto;
  border-radius: 10px 0 0 0; border: 1px solid rgba(20,20,40,.08); box-shadow: 0 24px 50px -28px rgba(30,40,90,.35);
  transition: transform .6s cubic-bezier(.2,.7,.2,1); }
a.card:hover .card-media img { transform: translate(-8px, -8px); }
/* images that already have their own background/frame: show whole, no extra frame */
.card-media.plain img { left: 0; top: 0; width: 100%; height: 100%; padding: clamp(12px, 2vw, 28px); object-fit: contain; border: 0; border-radius: 0; box-shadow: none; }
a.card:hover .card-media.plain img { transform: scale(1.03); }
.card-body { padding: clamp(22px, 3.4vw, 48px); display: grid; align-content: center; gap: 14px; justify-items: start; }
.tag { font-size: .82rem; color: #575757; background: #F4F4F4; border-radius: 999px; padding: 4px 12px; }
.card h2 { font-size: clamp(1.25rem, 1.9vw, 1.5rem); line-height: 1.25; letter-spacing: -0.02em; }
.card p { color: var(--body); font-size: .97rem; max-width: 46ch; }
.btn { display: inline-flex; align-items: center; gap: 10px; background: var(--ink); color: #fff; font-weight: 500; font-size: .95rem; padding: 12px 24px; border-radius: 999px; margin-top: 6px; transition: gap .25s, background .25s; }
a.card:hover .btn { gap: 14px; background: #000; }
.btn.soon { background: #E2E2E2; color: #555; }
@media (max-width: 820px) {
  .card { grid-template-columns: 1fr; }
  .card-media { min-height: 0; aspect-ratio: 16 / 11; border-right: 0; border-bottom: 1px solid var(--line); }
  .card-media img { left: 8%; top: 10%; }
  .card-media.plain img { left: 0; top: 0; }
}

/* ================= CASE STUDY ================= */
.cs-head { padding-block: clamp(48px, 7vw, 96px) clamp(32px, 4vw, 48px); text-align: center; }
.cs-head h1 { font-size: clamp(2.4rem, 5.4vw, 4.2rem); line-height: 1.04; letter-spacing: -0.04em; max-width: 22ch; margin: 0 auto; text-wrap: balance; }
.cs-head h1 .lt { font-weight: 300; display: block; }
.cs-head h1 b { font-weight: 700; display: block; }
.nb { white-space: nowrap; }
.lede { margin: 28px auto 0; max-width: 58ch; font-size: clamp(1.05rem, 1.4vw, 1.2rem); color: var(--body); line-height: 1.6; text-wrap: pretty; }
.meta { margin-top: clamp(36px, 5vw, 56px); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0 28px; text-align: center; }
.meta div { border-top: 1px solid var(--line); padding-top: 14px; min-width: 0; }
.meta dt { font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.meta dd { margin-top: 6px; font-weight: 500; font-size: 0.95rem; }
@media (max-width: 760px) { .meta { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; } }

.hero-shot { margin-bottom: clamp(56px, 7vw, 88px); border-radius: var(--r); overflow: hidden; background: var(--surface);
  padding: clamp(20px, 5vw, 64px) clamp(20px, 7vw, 96px) 0; border: 1px solid var(--line); }
.hero-shot img, .hero-shot video { display: block; width: 100%; height: auto; border-radius: 10px 10px 0 0; border: 0;
  box-shadow: 0 30px 60px -36px rgba(30,40,90,.35); }
/* screenshots that already carry their own border and rounded corners */
.hero-shot.own-frame img { border-radius: 0; box-shadow: none; filter: drop-shadow(0 24px 28px rgba(30,40,90,.16)); }
/* hero with a transparent phones image */
.hero-shot.phones-hero { padding: clamp(20px, 4vw, 48px) clamp(20px, 6vw, 80px); }
.hero-shot.phones-hero img { border-radius: 0; box-shadow: none; filter: drop-shadow(0 24px 30px rgba(20,20,40,.18)); }
.hero-shot.bg { background-size: cover; background-position: center; border: 0; }
.hero-shot.bg img { border: 0; border-radius: 0; box-shadow: none; }

.tldr { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 40px; margin-bottom: clamp(56px, 6vw, 88px); }
.tldr article { border-top: 1px solid var(--line); padding-top: 18px; display: grid; gap: 10px; align-content: start; }
.tldr .eyebrow { font-family: var(--font); font-size: 1.15rem; font-weight: 600; letter-spacing: -0.015em; text-transform: none; color: var(--accent); }
.tldr p { color: var(--body); text-wrap: pretty; }
@media (max-width: 860px) { .tldr { grid-template-columns: 1fr; gap: 28px; } }

.story { display: grid; gap: clamp(56px, 6vw, 88px); }
.chapter { display: grid; justify-items: center; text-align: center; gap: clamp(14px, 1.8vw, 22px); }
.chapter + .chapter.sub { margin-top: calc(-1 * clamp(20px, 2.5vw, 36px)); }
.pill { display: inline-flex; align-items: center; gap: 10px; padding: 9px 22px; border-radius: 999px; background: var(--surface); border: 1px solid #EBEBED; color: #8E8E97; font-weight: 600; font-size: clamp(.92rem, 1.2vw, 1.05rem); }
.pill .n { font-family: var(--font-mono); font-weight: 500; font-size: .74rem; color: var(--accent); }
.statement { max-width: 30em; font-size: clamp(1.45rem, 2.6vw, 2.15rem); line-height: 1.22; font-weight: 600; letter-spacing: -0.025em; text-wrap: balance; }
.statement.big { font-size: clamp(2rem, 4.4vw, 3.4rem); line-height: 1.06; letter-spacing: -0.04em; max-width: 20ch; }
.statement em { font-style: normal; color: var(--accent); }
.support { max-width: 62ch; font-size: 1.05rem; color: var(--muted); line-height: 1.7; }
.note { font-size: .88rem; color: var(--muted); font-style: italic; }

.shot { width: 100%; margin-top: clamp(8px, 2vw, 20px); }
.shot img { width: 100%; height: auto; border-radius: 4px; }
.shot { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: clamp(10px, 1.4vw, 16px); }
.shot.framed { padding: clamp(14px, 3vw, 40px); }
.duo { width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(10px, 1.6vw, 20px); margin-top: clamp(8px, 2vw, 20px); }
.duo > img, .duo > div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: clamp(10px, 1.4vw, 16px); }
.duo img { width: 100%; height: auto; border-radius: 4px; display: block; }
.duo > img { box-sizing: border-box; }
.duo.framed > * { padding: clamp(12px, 2vw, 28px); display: grid; place-items: center; }
.duo.framed img { padding: 0; border: 0; background: none; }
.phones { width: 100%; display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: clamp(10px, 1.6vw, 20px); background: var(--surface); border-radius: var(--r); padding: clamp(18px, 3.5vw, 48px); margin-top: clamp(8px, 2vw, 20px); align-items: start; }
.phones img { width: 100%; height: auto; }
@media (max-width: 720px) { .duo { grid-template-columns: 1fr; } .phones { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.logos { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: clamp(20px, 4vw, 48px); padding: 8px 0; }
.logos img { height: 30px; width: auto; filter: grayscale(1); opacity: .65; }

.trio { list-style: none; padding: 0; width: 100%; max-width: 1000px; display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); gap: 36px 36px; text-align: left; margin-top: 10px; }
.trio > li { border-top: 1px solid var(--line); padding-top: 18px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.trio > li::before { content: counter(item, decimal-leading-zero); counter-increment: item; font-family: var(--font-mono); font-size: .72rem; color: var(--accent); }
.trio { counter-reset: item; }
.trio h3 { font-size: 1.08rem; letter-spacing: -0.02em; line-height: 1.3; }
.trio p { color: var(--muted); font-size: .96rem; }
@media (max-width: 900px) { .trio { --cols: 2 !important; } }
@media (max-width: 560px) { .trio { --cols: 1 !important; } }

/* full-width grey band for a chapter */
.chapter.band { width: 100vw; margin-inline: calc(50% - 50vw); background: var(--surface); padding: clamp(48px, 6vw, 80px) clamp(16px, 4vw, 48px); }
.band .pill { background: #fff; }

/* final screens: full-width grey band, short title + explanation per feature, screens side by side */
.features { width: 100vw; margin-inline: calc(50% - 50vw); margin-top: clamp(8px, 2vw, 24px); background: var(--surface);
  padding: clamp(8px, 2vw, 24px) clamp(16px, 4vw, 48px); text-align: left; }
.feature { max-width: 1240px; margin-inline: auto; display: grid; gap: clamp(16px, 2vw, 24px); padding-block: clamp(40px, 5vw, 72px); border-top: 1px solid #E3E3E7; }
.feature:first-child { border-top: 0; }
.feature-text { width: 100%; }
.feature-text h3 { display: flex; align-items: baseline; gap: 12px; font-size: clamp(1.15rem, 1.6vw, 1.35rem); font-weight: 600; letter-spacing: -0.02em; line-height: 1.25; }
.feature-text .fn { font-family: var(--font-mono); font-size: .78rem; font-weight: 500; letter-spacing: .04em; color: var(--accent); }
.feature-shots { display: grid; gap: clamp(14px, 2.4vw, 32px); align-items: start; }
.feature-shots.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.feature-shots:not(.two) { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.feature-shots img { width: 100%; height: auto; display: block; border-radius: var(--r); box-shadow: 0 1px 2px rgba(20,20,30,.06), 0 18px 40px -24px rgba(20,20,30,.28); }
.feature-shots.phones-shots { grid-template-columns: repeat(var(--n, 5), minmax(0, 1fr)); max-width: calc(var(--n, 5) * 230px); }
.feature-shots.phones-shots img { box-shadow: none; border-radius: 0; background: none; }
@media (max-width: 760px) { .feature-shots.two, .feature-shots:not(.two) { grid-template-columns: 1fr; } .feature-shots.phones-shots { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.zoomable { cursor: zoom-in; transition: transform .25s ease, box-shadow .25s ease; }
.zoomable:hover { transform: translateY(-2px); box-shadow: 0 1px 2px rgba(20,20,30,.06), 0 24px 48px -24px rgba(20,20,30,.34); }

/* lightbox */
.lightbox { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: clamp(16px, 4vw, 56px); background: rgba(14,14,18,.86);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); opacity: 0; transition: opacity .25s ease; cursor: zoom-out; }
.lightbox.open { opacity: 1; }
.lightbox img { max-width: min(100%, 1600px); max-height: calc(100vh - 2 * clamp(16px, 4vw, 56px) - 30px); width: auto; height: auto; object-fit: contain; border-radius: 8px; box-shadow: 0 30px 80px -20px rgba(0,0,0,.6); transform: scale(.97); transition: transform .25s ease; }
.lightbox.open img { transform: none; }
.lightbox-close { position: absolute; top: 16px; right: 16px; width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(255,255,255,.12); color: #fff; font-size: 22px; line-height: 40px; cursor: pointer; }
.lightbox-close:hover { background: rgba(255,255,255,.22); }
.lightbox-cap { position: absolute; bottom: 16px; left: 0; right: 0; text-align: center; color: rgba(255,255,255,.75); font-size: .9rem; }

/* small row of reference phone screens inside a frame */
.duo > .mini-phones { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(6px, 1vw, 12px); align-items: center; }
.mini-phones img { width: 100%; height: auto; border-radius: 6px; }

-elbom/\" target=\"_blank\" rel=\"noopener\">LinkedIn<\/a>\n      <a class=\"cta\" href=\"https://api.whatsapp.com/send?phone=972507307688\" target=\"_blank\" rel=\"noopener\">Let\u2019s chat<\/a>\n    <\/div>\n  <\/nav>\n<\/div>\n\n<main class=\"wrap\">\n  <header class=\"cs-head\">\n    <h1><span class=\"lt\">Heritage meets blockchain,<\/span> <b>an admin built from scratch<\/b><\/h1>\n    <p class=\"lede\">Israel\u2019s largest heritage organization wanted to reach younger donors with <span class=\"nb\">limited-edition<\/span> digital collectibles. I&nbsp;designed the admin platform that gives their team full control, from the first collection to the final donation.<\/p>\n    <dl class=\"meta\">\n      <div><dt>Role<\/dt><dd>Product Designer<\/dd><\/div>\n      <div><dt>Team<\/dt><dd>PM, designer, project &amp; dev teams<\/dd><\/div>\n      <div><dt>Scope<\/dt><dd>Research, UX, wireframes, UI<\/dd><\/div>\n      <div><dt>Platform<\/dt><dd>Desktop web (B2B)<\/dd><\/div>\n    <\/dl>\n  <\/header>\n\n  <figure class=\"hero-shot own-frame\"><img src=\"assets/media/nft-hero.webp\" alt=\"NFT admin platform, dashboard overview\" width=\"2400\" height=\"1355\"><\/figure>\n\n  <section class=\"tldr\">\n    <article><p class=\"eyebrow\">The challenge<\/p><p>Launch a blockchain donation experience with no existing reference, without losing the spirit of giving.<\/p><\/article>\n    <article><p class=\"eyebrow\">The company<\/p><p>Israel\u2019s largest heritage organization, funded by donations and now reaching younger donors with digital collectibles.<\/p><\/article>\n    <article><p class=\"eyebrow\">The project<\/p><p>An admin system for item management, donor details, financial reports and donation approval, all run by an internal employee.<\/p><\/article>\n  <\/section>\n\n  <div class=\"story\">\n    <section class=\"chapter reveal\">\n      <p class=\"pill\"><span class=\"n\">01<\/span>Exploring the problem<\/p>\n      <p class=\"statement\">We had to create a product from scratch, with <em>no references<\/em> for admin systems in the blockchain world, especially for donations.<\/p>\n      <div class=\"duo\"><img src=\"https://adidamari.co.il/wp-content/uploads/2025/10/Frame-12436-scaled.webp\" alt=\"Brainstorm board\" loading=\"lazy\"><img src=\"https://adidamari.co.il/wp-content/uploads/2025/10/Frame-12435678-scaled.webp\" alt=\"Research mapping\" loading=\"lazy\"><\/div>\n    <\/section>\n\n    <section class=\"chapter sub reveal\">\n      <p class=\"pill\">Market research<\/p>\n      <p class=\"support\">We studied the admin systems of large online-marketplace platforms such as Shopify, Wix, Magento and BigCommerce to learn how they are built and which features work. Since we were starting from zero, this told us where to begin.<\/p>\n      <div class=\"marquee\" aria-label=\"Platforms we studied: Shopify, Wix, BigCommerce, Magento\"><div class=\"marquee-track\" aria-hidden=\"true\"><span>Shopify<\/span><span>Wix<\/span><span>BigCommerce<\/span><span>Magento<\/span><span>Shopify<\/span><span>Wix<\/span><span>BigCommerce<\/span><span>Magento<\/span><span>Shopify<\/span><span>Wix<\/span><span>BigCommerce<\/span><span>Magento<\/span><span>Shopify<\/span><span>Wix<\/span><span>BigCommerce<\/span><span>Magento<\/span><\/div><\/div>\n      <div class=\"cmp-grid\"><div class=\"cmp-card\"><table class=\"cmp\"><thead><tr><th><\/th><th>Wix<\/th><th>BigCommerce<\/th><th>Shopify<\/th><th>Magento<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">System &amp; settings<\/th><td class=\"n\" aria-label=\"No\"><svg viewBox=\"0 0 20 20\"><circle cx=\"10\" cy=\"10\" r=\"8.5\"/><path d=\"M7.2 7.2l5.6 5.6M12.8 7.2l-5.6 5.6\"/><\/svg><\/td><td class=\"n\" aria-label=\"No\"><svg viewBox=\"0 0 20 20\"><circle cx=\"10\" cy=\"10\" r=\"8.5\"/><path d=\"M7.2 7.2l5.6 5.6M12.8 7.2l-5.6 5.6\"/><\/svg><\/td><td class=\"n\" aria-label=\"No\"><svg viewBox=\"0 0 20 20\"><circle cx=\"10\" cy=\"10\" r=\"8.5\"/><path d=\"M7.2 7.2l5.6 5.6M12.8 7.2l-5.6 5.6\"/><\/sv .png\" data-full=\"https://adidamari.co.il/wp-content/uploads/2025/10/sssss.png\" alt=\"Donor purchase completion\" loading=\"lazy\"><img src=\"https://adidamari.co.il/wp-content/uploads/2024/12/sc5-2.png\" alt=\"Purchase completion detail\" loading=\"lazy\"><\/div>\n        <\/article>\n      <\/div>\n    <\/section>\n\n    <section class=\"chapter reveal\">\n      <p class=\"pill\"><span class=\"n\">05<\/span>Impact<\/p>\n      <p class=\"statement\">Non-technical teams now create and manage NFTs <em>at scale<\/em>, on their own.<\/p>\n      <ul class=\"results\">\n        <li><span class=\"big-num\">27%<\/span><p class=\"eyebrow\">Faster creation<\/p><h3>Time to complete the creation flow<\/h3><p>A step-by-step flow with live previews cut the average completion time (estimated).<\/p><\/li>\n        <li><span class=\"big-num\">30%<\/span><p class=\"eyebrow\">More consistent<\/p><h3>Consistency through templates<\/h3><p>Predefined templates simplified creation and reduced errors (estimated).<\/p><\/li>\n        <li><span class=\"big-num\">~3<\/span><p class=\"eyebrow\">Fewer errors per session<\/p><h3>Fewer data-entry mistakes<\/h3><p>Validations, field restrictions and in-context guidance reduced manual corrections.<\/p><\/li>\n      <\/ul>\n    <\/section>\n  <\/div>\n\n  <a class=\"next reveal\" href=\"#money-transfer-platform\">\n    <span class=\"eyebrow\">Next case study<\/span>\n    <span class=\"title\">Boosting companies\u2019 profits<\/span>\n    <span class=\"go\">View case study <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14M13 6l6 6-6 6\"/><\/svg><\/span>\n  <\/a>\n<\/main>\n\n<footer class=\"site-foot\" id=\"contact\">\n  <div class=\"foot-inner\">\n    <div class=\"foot-main\">\n      <h2 class=\"foot-title reveal\"><span class=\"hl\">Let\u2019s Connect.<\/span><\/h2>\n      <div class=\"foot-links\">\n        <a href= te\" aria-label=\"Main\">\n    <a class=\"brand\" href=\"#home\">Adi Elbom.<\/a>\n    <div class=\"navlinks\">\n      <div class=\"nav-dd\">\n        <a class=\"dd-trigger current\" href=\"#work\" aria-haspopup=\"true\" aria-expanded=\"false\">Projects <svg class=\"chev\" width=\"10\" height=\"10\" viewBox=\"0 0 10 10\" aria-hidden=\"true\"><path d=\"M2 3.5 5 6.5 8 3.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><\/a>\n        <div class=\"dd\" role=\"menu\">\n          <a href=\"#nft-admin\"><span class=\"dd-title\">NFT Admin Platform<\/span><\/a>\n          <a href=\"#money-transfer-platform\" aria-current=\"page\" class=\"is-current\"><span class=\"dd-title\">Money Transfer Platform<\/span><\/a>\n          <a href=\"#medical-students-app\"><span class=\"dd-title\">Medical Students App<\/span><\/a>\n          <span class=\"dd-soon\"><span class=\"dd-title\">Animated Captions <span class=\"dd-note\">\u00b7 Coming soon<\/span><\/span><\/span>\n        <\/div>\n      <\/div>\n      <a href=\"https://drive.google.com/file/d/1dUDBJgoNw1x8Hw4QgFYmObVrlOSRtjmj/view\" target=\"_blank\" rel=\"noopener\">Resume<\/a>\n      <a class=\"hide-sm\" href=\"https://www.linkedin.com/in/adi-elbom/\" target=\"_blank\" rel=\"noopener\">LinkedIn<\/a>\n      <a class=\"cta\" href=\"https://api.whatsapp.com/send?phone=972507307688\" target=\"_blank\" rel=\"noopener\">Let\u2019s chat<\/a>\n    <\/div>\n  <\/nav>\n<\/div>\n\n<main class=\"wrap\">\n  <header class=\"cs-head\">\n    <h1><span class=\"lt\">Money transfers for business,<\/span> <b>without the friction<\/b><\/h1>\n    <p class=\"lede\">A B2B platform for one of Israel\u2019s leading financial groups, where business clients transfer funds, convert currencies and track every operation from one dashboard.<\/p>\n    <dl class=\"meta\">\n      <div><dt>Role<\/dt><dd>Product Designer<\/dd><\/div>\n      <div><dt>Team<\/dt><dd>PM, 2 product designers, dev team<\/dd><\/div>\n      <div><dt>Scope<\/dt><dd>Research, UX, UI, mobile<\/dd><\/div>\n      <div><dt>Platform<\/dt><dd>Desktop web + mobile<\/dd><\/div>\n    <\/dl>\n  <\/header>\n\n  <figure class=\"hero-shot\"><img src=\"assets/media/money-hero.webp\" alt=\"Money transfer platform dashboard\" width=\"2400\" height=\"1406\"><\/figure>\n\n  <section class=\"tldr\">\n    <article><p class=\"eyebrow\">The challenge<\/p><p>Give business clients a transparent way to move large sums, competing with global giants on both fees and ease of use.<\/p><\/article>\n    <article><p class=\"eyebrow\">The company<\/p><p>One of Israel\u2019s leading financial groups, active in insurance, investments, credit and distribution.<\/p><\/article>\n    <article><p class=\"eyebrow\">Impact<\/p><p>~25% more engagement, ~30% faster transactions, and 23% of new users paying in their first session.<\/p><\/article>\n  <\/section>\n\n  <div class=\"story\">\n    <section class=\"chapter reveal\">\n      <p class=\"pill\"><span class=\"n\">01<\/span>Exploring the problem<\/p>\n      <p class=\"statement\">Building from scratch meant learning what business clients <em>expect from the best<\/em> in the market.<\/p>\n    <\/section>\n\n    <section class=\"chapter sub reveal\">\n      <p class=\"pill\">Market research<\/p>\n      <p class=\"support\">We studied B2B transfer and currency platforms such as Currencycloud, OFX, Tipalti and Payoneer to see how they\u2019re built and which features business clients expect.<\/p>\n      <div class=\"marquee\" aria-label=\"Platforms we studied: Currencycloud, OFX, Tipalti, Payoneer\"><div class=\"marquee-track\" aria-hidden=\"true\"><span>Currencycloud<\/span><span>OFX<\/span><span>Tipalti<\/span><span>Payoneer<\/span><span>Currencycloud<\/span><span>OFX<\/span><span>Tipalti<\/span><span>Payoneer<\/span><span>Currencycloud<\/span><span>OFX<\/span><span>Tipalti<\/span><span>Payoneer<\/span><span>Currencycloud<\/span><span>OFX<\/span><span>Tipalti<\/span><span>P -label=\"No\"><svg viewBox=\"0 0 20 20\"><circle cx=\"10\" cy=\"10\" r=\"8.5\"/><path d=\"M7.2 7.2l5.6 5.6M12.8 7.2l-5.6 5.6\"/><\/svg><\/td><td class=\"y\" aria-label=\"Yes\"><svg viewBox=\"0 0 20 20\"><circle cx=\"10\" cy=\"10\" r=\"8.5\"/><path d=\"M6.5 10.2l2.3 2.3 4.7-4.8\"/><\/svg><\/td><td class=\"n\" aria-label=\"No\"><svg viewBox=\"0 0 20 20\"><circle cx=\"10\" cy=\"10\" r=\"8.5\"/><path d=\"M7.2 7.2l5.6 5.6M12.8 7.2l-5.6 5.6\"/><\/svg><\/td><\/tr><tr><th scope=\"row\">Cryptocurrency support<\/th><td class=\"n\" aria-label=\"No\"><svg viewBox=\"0 0 20 20\"><circle cx=\"10\" cy=\"10\" r=\"8.5\"/><path d=\"M7.2 7.2l5.6 5.6M12.8 7.2l-5.6 5.6\"/><\/svg><\/td><td class=\"n\" aria-label=\"No\"><svg viewBox=\"0 0 20 20\"><circle cx=\"10\" cy=\"10\" r=\"8.5\"/><path d=\"M7.2 7.2l5.6 5.6M12.8 7.2l-5.6 5.6\"/><\/svg><\/td><td class=\"n\" aria-label=\"No\"><svg viewBox=\"0 0 20 20\"><circle cx=\"10\" cy=\"10\" r=\"8.5\"/><path d=\"M7.2 7.2l5.6 5.6M12.8 7.2l-5.6 5.6\"/><\/svg><\/td><td class=\"n\" aria-label=\"No\"><svg viewBox=\"0 0 20 20\"><circle cx=\"10\" cy=\"10\" r=\"8.5\"/><path d=\"M7.2 7.2l5.6 5.6M12.8 7.2l-5.6 5.6\"/><\/svg><\/td><\/tr><\/tbody><\/table><\/div><\/div>\n    <\/section>\n\n    <section class=\"chapter band reveal\">\n      <p class=\"pill\"><span class=\"n\">02<\/span>Key insights<\/p>\n      <p class=\"statement big\">Low fees aren\u2019t enough. It has to be <em>easy to use.<\/em><\/p>\n      <p class=\"support\">Clients needed a real alternative to global fintechs: low fees with high usability, <span class=\"nb\">real-time<\/span> monitoring, clear tracking of every transaction, and a smooth fit with their existing <span class=\"nb\">financial systems.<\/span><\/p>\n    <\/section>\n\n    <section class=\"chapter reveal\">\n      <p class=\"pill\"><span class=\"n\">03<\/span>User journey<\/p>\n      <p class=\"statement\">Adding a beneficiary, with <em>back-office approval<\/em> before the first payment.<\/p>\n      <figure class=\"flow\"><d ps://adidamari.co.il/wp-content/uploads/2025/10/Sarari-12-scaled.png\" alt=\"Medical students app, three key screens\" width=\"2560\" height=\"1746\"><\/figure>\n\n  <section class=\"tldr\">\n    <article><p class=\"eyebrow\">The challenge<\/p><p>Give interns the learning content they need, fast, on a phone, in the few minutes they have between shifts.<\/p><\/article>\n    <article><p class=\"eyebrow\">The client<\/p><p>Sheba\u2019s department for interns, which pairs academic learning with practical training in the hospital.<\/p><\/article>\n    <article><p class=\"eyebrow\">Impact<\/p><p>21% more mobile sessions, rollouts cut from two weeks to 6 days, and 42% faster content discovery.<\/p><\/article>\n  <\/section>\n\n  <div class=\"story\">\n    <section class=\"chapter reveal\">\n      <p class=\"pill\"><span class=\"n\">01<\/span>Exploring the problem<\/p>\n      <p class=\"statement\">Interns need the <em>right content<\/em>, on their phone, in the few minutes they have.<\/p>\n      <div class=\"duo\">\n        <img src=\"https://adidamari.co.il/wp-content/uploads/2025/10/Frame-1243666-scaled.webp\" alt=\"Research board: questions, UX and edge cases\" loading=\"lazy\">\n        <div class=\"mini-phones\"><img src=\"https://adidamari.co.il/wp-content/uploads/2025/05/IMG_8739.png\" alt=\"Reference app screen\" loading=\"lazy\"><img src=\"https://adidamari.co.il/wp-content/uploads/2025/05/IMG_8737.png\" alt=\"Reference app screen\" loading=\"lazy\"><img src=\"https://adidamari.co.il/wp-content/uploads/2025/05/IMG_8742.png\" alt=\"Reference app screen\" loading=\"lazy\"><img src=\"https://adidamari.co.il/wp-content/uploads/2025/05/IMG_8738.png\" alt=\"Reference app screen\" loading=\"lazy\"><\/div>\n      <\/div>\n    <\/section>\n\n    <section class=\"chapter sub reveal\">\n      <p class=\"pill\">Market research<\/p>\n      <p class=\"support\">I studied leading learning platforms such as Coursera, Udemy, Domestika and Skillshare to see how the market leaders s iewBox=\"0 0 20 20\"><circle cx=\"10\" cy=\"10\" r=\"8.5\"/><path d=\"M7.2 7.2l5.6 5.6M12.8 7.2l-5.6 5.6\"/><\/svg><\/td><\/tr><\/tbody><\/table><\/div><div class=\"cmp-card\"><table class=\"cmp\"><thead><tr><th><\/th><th>Coursera<\/th><th>Udemy<\/th><th>Domestika<\/th><th>Skillshare<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Real-time notifications<\/th><td class=\"y\" aria-label=\"Yes\"><svg viewBox=\"0 0 20 20\"><circle cx=\"10\" cy=\"10\" r=\"8.5\"/><path d=\"M6.5 10.2l2.3 2.3 4.7-4.8\"/><\/svg><\/td><td class=\"y\" aria-label=\"Yes\"><svg viewBox=\"0 0 20 20\"><circle cx=\"10\" cy=\"10\" r=\"8.5\"/><path d=\"M6.5 10.2l2.3 2.3 4.7-4.8\"/><\/svg><\/td><td class=\"n\" aria-label=\"No\"><svg viewBox=\"0 0 20 20\"><circle cx=\"10\" cy=\"10\" r=\"8.5\"/><path d=\"M7.2 7.2l5.6 5.6M12.8 7.2l-5.6 5.6\"/><\/svg><\/td><td class=\"n\" aria-label=\"No\"><svg viewBox=\"0 0 20 20\"><circle cx=\"10\" cy=\"10\" r=\"8.5\"/><path d=\"M7.2 7.2l5.6 5.6M12.8 7.2l-5.6 5.6\"/><\/svg><\/td><\/tr><tr><th scope=\"row\">Admin sync<\/th><td class=\"y\" aria-label=\"Yes\"><svg viewBox=\"0 0 20 20\"><circle cx=\"10\" cy=\"10\" r=\"8.5\"/><path d=\"M6.5 10.2l2.3 2.3 4.7-4.8\"/><\/svg><\/td><td class=\"y\" aria-label=\"Yes\"><svg viewBox=\"0 0 20 20\"><circle cx=\"10\" cy=\"10\" r=\"8.5\"/><path d=\"M6.5 10.2l2.3 2.3 4.7-4.8\"/><\/svg><\/td><td class=\"n\" aria-label=\"No\"><svg viewBox=\"0 0 20 20\"><circle cx=\"10\" cy=\"10\" r=\"8.5\"/><path d=\"M7.2 7.2l5.6 5.6M12.8 7.2l-5.6 5.6\"/><\/svg><\/td><td class=\"n\" aria-label=\"No\"><svg viewBox=\"0 0 20 20\"><circle cx=\"10\" cy=\"10\" r=\"8.5\"/><path d=\"M7.2 7.2l5.6 5.6M12.8 7.2l-5.6 5.6\"/><\/svg><\/td><\/tr><tr><th scope=\"row\">Favorites &amp; personalization<\/th><td class=\"y\" aria-label=\"Yes\"><svg viewBox=\"0 0 20 20\"><circle cx=\"10\" cy=\"10\" r=\"8.5\"/><path d=\"M6.5 10.2l2.3 2.3 4.7-4.8\"/><\/svg><\/td><td class=\"y\" aria-label=\"Yes\"><svg viewBox=\"0 0 20 20\"><circle cx=\"10\" cy=\"10\" r=\"8.5\"/><path d=\"M6.5 10. ">\n        <li><h3>Updates come first<\/h3><p>Real-time notifications from lecturers sit at the top of the home page, so nothing is missed between shifts.<\/p><\/li>\n        <li><h3>Find it fast<\/h3><p>Quick filters by class or lecturer, plus a search with autocomplete, cut the time to the right lesson.<\/p><\/li>\n        <li><h3>One lesson, one place<\/h3><p>Media, reference files and assessments live together on each lesson page, with favorites for quick return.<\/p><\/li>\n        <li><h3>Synced with lecturers<\/h3><p>Assignments and results are saved straight to the lecturers\u2019 admin platform, with no extra steps.<\/p><\/li>\n      <\/ul>\n    <\/section>\n\n    <section class=\"chapter reveal\">\n      <p class=\"pill\"><span class=\"n\">03<\/span>Visual design<\/p>\n      <p class=\"statement\">A calm, focused app that <em>surfaces what\u2019s next<\/em> for every intern.<\/p>\n      <div class=\"features\">\n        <article class=\"feature\">\n          <div class=\"feature-text\"><h3><span class=\"fn\">01<\/span>Home page<\/h3><\/div>\n          <div class=\"feature-shots phones-shots\" style=\"--n:4\"><img src=\"https://adidamari.co.il/wp-content/uploads/2025/06/2.png\" alt=\"Home page\" loading=\"lazy\"><img src=\"https://adidamari.co.il/wp-content/uploads/2025/06/Homepage-All1.png\" alt=\"Home page, all activities\" loading=\"lazy\"><img src=\"https://adidamari.co.il/wp-content/uploads/2025/06/Homepage-All1-1.png\" alt=\"Home page, filtered\" loading=\"lazy\"><img src=\"https://adidamari.co.il/wp-content/uploads/2025/05/Homepage-All1-1.png\" alt=\"Home page, details\" loading=\"lazy\"><\/div>\n        <\/article>\n        <article class=\"feature\">\n          <div class=\"feature-text\"><h3><span class=\"fn\">02<\/span>Lesson page<\/h3><\/div>\n          <div class=\"feature-shots phones-shots\" style=\"--n:5\"><img src=\"https://adidamari.co.il/wp-content/uploads/2025/06/1.png\" alt=\"Lesson page\" loading=\"lazy\"><img src=\"https://adidamari.co.il/wp-content/uploads/2025/06/dd.png\" alt=\"Lesson video\" loading=\"lazy\"><img src=\"https://adidamari.co.il/wp-content/uploads/2025/05/Lesson-page-Media-details.png\" alt=\"Lesson media details\" loading=\"lazy\"><img src=\"https://adidamari.co.il/wp-content/uploads/2025/06/Lesson-page-Reference.png\" alt=\"Reference files\" loading=\"lazy\"><img src=\"https://adidamari.co.il/wp-content/uploads/2025/06/Lesson-page-Exam-details-chose-answer.png\" alt=\"Lesson assessment\" loading=\"lazy\"><\/div>\n        <\/article>\n      <\/div>\n    <\/section>\n\n    <section class=\"chapter reveal\">\n      <p class=\"pill\"><span class=\"n\">04<\/span>Key outcomes<\/p>\n      <p class=\"statement\">Better mobile access, easier navigation, <em>less admin work<\/em>.<\/p>\n      <ul class=\"results\">\n        <li><span class=\"big-num\">21%<\/span><p class=\"eyebrow\">More mobile sessions<\/p><h3>Mobile sessions surge<\/h3><p>Students access study materials even during hospital shifts.<\/p><\/li>\n        <li><span class=\"big-num\">6d<\/span><p class=\"eyebrow\">Down from two weeks<\/p><h3>Faster feature rollouts<\/h3><p>Fast feedback workshops with developers shortened critical rollouts.<\/p><\/li>\n        <li><span class=\"big-num\">42%<\/span><p class=\"eyebrow\">Faster<\/p><h3>Content discovery<\/h3><p>Task-focused navigation cut the average time to find relevant content.<\/p><\/li>\n      <\/ul>\n    <\/section>\n  <\/div>\n\n  <a class=\"next reveal\" href=\"#nft-admin\">\n    <span class=\"eyebrow\">Next case study<\/span>\n    <span class=\"title\">NFT admin platform<\/span>\n    <span class=\"go\">View case study <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14M13 6l6 6-6 6\"/><\/svg><\/span>\n  <\/a>\n<\/main>\n\n<footer class=\"site-foot\" id=\"contact\">\n  <div class=\"foot-inner\">\n    <div class=\"foot-main\">\n      <h2 class=\"foot-title reveal\"><span class=\"hl\">Let\u2019s Connect.<\/span><\/h2>\n      <div class=\"foot-links\">\n        <a href=\"https://api.whatsapp.com/send?phone=972507307688\" target=\"_blank\" rel=\"noopener\">WhatsApp <span class=\"ext\" aria-hidden=\"true\">\u2197<\/span><\/a>\n        <a href=\"https://www.linkedin.com/in/adi-elbom/\" target=\"_blank\" rel=\"noopener\">LinkedIn <span class=\"ext\" aria-hidden=\"true\">\u2197<\/span><\/a>\n        <a href=\"mailto:adi.elbom3@gmail.com\">Email <span class=\"ext\" aria-hidden=\"true\">\u2197<\/span><\/a>\n      <\/div>\n    <\/div>\n    <div class=\"clock\" id=\"clock\" aria-live=\"off\">\n        <span class=\"clock-icons\" aria-hidden=\"true\">\n          <svg class=\"ci ci-sunrise\" viewBox=\"0 0 32 32\"><path d=\"M4 23h24M9 23a7 7 0 0 1 14 0\"/><path d=\"M16 9v3M7.5 13.5l2 2M24.5 13.5l-2 2M3.5 19h2.5M26 19h2.5\"/><path d=\"M13 6l3-3 3 3\"/><\/svg>\n          <svg class=\"ci ci-sun\" viewBox=\"0 0 32 32\"><circle cx=\"16\" cy=\"16\" r=\"5.5\"/><path d=\"M16 3v3.5M16 25.5V29M3 16h3.5M25.5 16H29M6.8 6.8l2.5 2.5M22.7 22.7l2.5 2.5M6.8 25.2l2.5-2.5M22.7 9.3l2.5-2.5\"/><\/svg>\n          <svg class=\"ci ci-sunset\" viewBox=\"0 0 32 32\"><path d=\"M4 23h24M9 23a7 7 0 0 1 14 0\"/><path d=\"M16 9v3M7.5 13.5l2 2M24.5 13.5l-2 2M3.5 19h2.5M26 19h2.5\"/><path d=\"M13 27l3 3 3-3\"/><\/svg>\n          <svg class=\"ci ci-moon\" viewBox=\"0 0 32 32\"><path d=\"M21.5 20.5A9.5 9.5 0 0 1 11.5 6a10 10 0 1 0 14 13.5 9.4 9.4 0 0 1-4 1Z\"/><path d=\"M23 5.5v3M21.5 7h3M26.5 11v2M25.5 12h2\"/><\/svg>\n        <\/span>\n        <span class=\"clock-label\">Local time \u00b7 Tel Aviv<\/span>\n        <span class=\"clock-time\"><span class=\"hh\">--<\/span><span class=\"colon\">:<\/span><span class=\"mm\">--<\/span><\/span>\n    <\/div>\n  <\/div>\n  <div class=\"foot-bottom\">\n    <span>\u00a9 2026 Adi Elbom Dam Ari \u00b7 Product Designer<\/span>\n    <a href=\"#top\" onclick=\"window.scrollTo({top:0,behavior:'smooth'});return fals <script>
var P=JSON.parse(document.getElementById('pages').textContent),T={"home": "Adi Elbom \u00b7 Product Designer", "nft-admin": "NFT Admin Platform \u00b7 Adi Elbom", "money-transfer-platform": "Money Transfer Platform \u00b7 Adi Elbom", "medical-students-app": "Medical Students App \u00b7 Adi Elbom"};
function reveal(){// Reveal sections as they scroll into view
(function () {
  var els = document.querySelectorAll('.reveal');
  if (!('IntersectionObserver' in window)) { els.forEach(function (e) { e.classList.add('in'); }); return; }
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (en) { if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); } });
  }, { rootMargin: '0px 0px -8% 0px', threshold: 0.05 });
  els.forEach(function (e) { io.observe(e); });
})();

// Floating "Scroll to explore" button: fades out gradually as the visitor scrolls
// (and fades back in if they return to the top); disappears for good once clicked.
(function () {
  var b = document.getElementById('scrollBtn');
  if (!b) return;
  var FADE = 450; // pixels of scrolling to fade out completely
  var clicked = false, ticking = false;
  function update() {
    ticking = false;
    if (clicked) return;
    var o = Math.max(0, 1 - window.scrollY / FADE);
    b.style.opacity = o;
    b.style.pointerEvents = o < 0.1 ? 'none' : '';
    b.style.visibility = o === 0 ? 'hidden' : '';
  }
  function onScroll() { if (!ticking) { ticking = true; requestAnimationFrame(update); } }
  b.addEventListener('click', function (e) {
    e.preventDefault();
    clicked = true;
    window.removeEventListener('scroll', onScroll);
    var w = document.getElementById('work');
    if (w) w.scrollIntoView({ behavior: 'smooth' });
    b.classList.add('gone');
    setTimeout(function () { b.remove(); }, 400);
  });
  window.addEventListener('scroll', onScroll, { passive: true });
  update();
})();

// Live Tel Aviv clock in the footer: time and an icon by time of day
(function () {
  var el = document.getElementById('clock');
  if (!el) return;
  var hh = el.querySelector('.hh'), mm = el.querySelector('.mm');
  var fmt;
  try { fmt = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Jerusalem', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }); }
  catch (e) { return; }
  function tick() {
    var parts = {}; fmt.formatToParts(new Date()).forEach(function (p) { parts[p.type] = p.value; });
    var h = parseInt(parts.hour, 10) % 24;
    hh.textContent = String(h).padStart(2, '0'); mm.textContent = parts.minute;
    var period = h >= 6 && h < 12 ? 'sunrise' : h >= 12 && h < 17 ? 'sun' : h >= 17 && h < 20 ? 'sunset' : 'moon';
    el.setAttribute('data-period', period);
  }
  tick();
  if (window.__clockTimer) clearInterval(window.__clockTimer);
  window.__clockTimer = setInterval(tick, 15000);
})();

// Projects dropdown: hover on desktop; on touch screens the first tap opens it, a tap outside closes it
(function () {
  var dd = document.querySelector('.nav-dd');
  if (!dd) return;
  var trigger = dd.querySelector('.dd-trigger');
  var touch = window.matchMedia('(hover: none)').matches;
  function set(open) { dd.classList.toggle('open', open); trigger.setAttribute('aria-expanded', open ? 'true' : 'false'); }
  trigger.addEventListener('click', function (e) {
    if (touch && !dd.classList.contains('open')) { e.preventDefault(); set(true); }
    else set(false);
  });
  document.addEventListener('click', function (e) { if (!dd.contains(e.target)) set(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') set(false); });
  dd.addEventListener('mouseleave', function () { set(false); });
})();

// Case studies: section navigator (left rail, wide screens only)
(function () {
  document.querySelectorAll('.toc').forEach(function (n) { n.remove(); });
  if (window.__tocScroll) { window.removeEventListener('scroll', window.__tocScroll); window.removeEventListener('resize', window.__tocScroll); }
  var story = document.querySelector('.story');
  var head = document.querySelector('.cs-head');
  if (!story || !head) return;
  var sections = [{ el: head, label: 'Overview' }];
  story.querySelectorAll('.chapter:not(.sub)').forEach(function (ch) {
    var pill = ch.querySelector('.pill');
    if (!pill) return;
    var label = pill.cloneNode(true); var n = label.querySelector('.n'); if (n) n.remove();
    sections.push({ el: ch, label: label.textContent.trim() });
  });
  // a section runs until the next one starts (sub-chapters belong to the chapter before them)
  var rail = document.createElement('nav');
  rail.className = 'toc'; rail.setAttribute('aria-label', 'Sections');
  sections.forEach(function (s, i) {
    if (!s.el.id) s.el.id = 'sec-' + i;
    var a = document.createElement('a');
    a.href = '#' + s.el.id;
    a.innerHTML = '<span class="ln"><i></i></span><span class="lb">' + s.label + '</span>';
    a.addEventListener('click', function (e) { e.preventDefault(); s.el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
    rail.appendChild(a); s.a = a; s.fill = a.querySelector('.ln i');
  });
  document.body.appendChild(rail);
  var foot = document.querySelector('.site-foot'), ticking = false;
  function top(el) { return el.getBoundingClientRect().top + window.scrollY; }
  function update() {
    ticking = false;
    var y = window.scrollY + window.innerHeight * 0.35, end = foot ? top(foot) : document.body.scrollHeight;
    var active = 0;
    sections.forEach(function (s, i) { if (top(s.el) <= y) active = i; });
    sections.forEach(function (s, i) {
      var start = top(s.el), stop = i + 1 < sections.length ? top(sections[i + 1].el) : end;
      var p = i < active ? 1 : i > active ? 0 : Math.min(1, Math.max(0, (y - start) / (stop - start)));
      s.fill.style.transform = 'scaleX(' + p + ')';
      s.a.classList.toggle('on', i === active);
    });
    var footVisible = foot && foot.getBoundingClientRect().top < window.innerHeight * 0.85;
    rail.classList.toggle('show', window.scrollY > 120 && !footVisible);
  }
  function onScroll() { if (!ticking) { ticking = true; requestAnimationFrame(update); } }
  window.__tocScroll = onScroll;
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);
  update();
})();

// User-flow diagrams: wider than the frame; on desktop the view follows the mouse, on touch it scrolls
(function () {
  document.querySelectorAll('.flow').forEach(function (fig) {
    var box = fig.querySelector('.flow-scroll');
    if (!box) return;
    var target = 0, raf = null;
    function edges() {
      var max = box.scrollWidth - box.clientWidth;
      box.style.setProperty('--fl', box.scrollLeft > 4 ? '48px' : '0px');
      box.style.setProperty('--fr', box.scrollLeft < max - 4 ? '48px' : '0px');
    }
    function step() {
      var d = target - box.scrollLeft;
      if (Math.abs(d) < 0.5) { box.scrollLeft = target; raf = null; edges(); return; }
      box.scrollLeft += d * 0.12; edges();
      raf = requestAnimationFrame(step);
    }
    box.addEventListener('mousemove', function (e) {
      var r = box.getBoundingClientRect();
      var p = Math.min(1, Math.max(0, (e.clientX - r.left - r.width * 0.1) / (r.width * 0.8)));
      target = p * (box.scrollWidth - box.clientWidth);
      fig.classList.add('explored');
      if (!raf) raf = requestAnimationFrame(step);
    });
    box.addEventListener('scroll', function () { edges(); if (box.scrollLeft > 10) fig.classList.add('explored'); }, { passive: true });
    window.addEventListener('resize', edges);
    edges();
  });
})();

// Click-to-enlarge for case-study screens
(function () {
  var imgs = document.querySelectorAll('.feature-shots img');
  if (!imgs.length) return;
  var box = null, last = null;
  function close() {
    if (!box) return;
    box.classList.remove('open');
    var b = box; box = null;
    setTimeout(function () { b.remove(); }, 250);
    document.removeEventListener('keydown', onKey);
    if (last) last.focus();
  }
  function onKey(e) { if (e.key === 'Escape') close(); }
  function open(img) {
    last = img;
    box = document.createElement('div');
    box.className = 'lightbox'; box.setAttribute('role', 'dialog'); box.setAttribute('aria-modal', 'true'); box.setAttribute('aria-label', img.alt || 'Screen');
    box.innerHTML = '<img alt=""><button class="lightbox-close" aria-label="Close">×</button><p class="lightbox-cap"></p>';
    box.querySelector('img').src = img.dataset.full || img.currentSrc || img.src;
    box.querySelector('img').alt = img.alt;
    box.querySelector('.lightbox-cap').textContent = img.alt;
    box.addEventListener('click', close);
    document.body.appendChild(box);
    requestAnimationFrame(function () { box.classList.add('open'); });
    box.querySelector('.lightbox-close').focus();
    document.addEventListener('keydown', onKey);
  }
  imgs.forEach(function (img) {
    img.classList.add('zoomable'); img.tabIndex = 0; img.setAttribute('role', 'button');
    img.addEventListener('click', function () { open(img); });
    img.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(img); } });
  });
})();
