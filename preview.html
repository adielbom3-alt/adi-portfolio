<style>/* Adi Elbom portfolio — shared styles */
:root {
  color-scheme: light;
  --paper: #FCFCFC;
  --white: #FFFFFF;
  --surface: #F5F5F6;
  --ink: #1F1F1F;
  --body: #46464D;
  --muted: #7A7A83;
  --line: #E6E6E9;
  --accent: #CC3366;          /* the pink from "Scroll to explore" */
  --accent-soft: #FBE9EF;
  --grid: #EEEEF1;            /* background grid lines (softer than --line) */
  --cell: 22px;               /* grid cell size; hero divider snaps to it */
  --marker: #FFE45C;          /* highlighter yellow for "Let's Connect." */
  --blue: #4C84FF;            /* Adi's primary blue from the WordPress site */

  --font: 'Red Hat Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'DM Mono', ui-monospace, Menlo, monospace;
  --font-logo: 'Song Myung', Georgia, serif;

  --maxw: 1180px;
  --text: 680px;
  --r: clamp(14px, 2vw, 22px);
  box-sizing: border-box;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 96px; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--font); font-size: 16px; line-height: 1.6;
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
h1, h2, h3, p, figure, ul, ol, dl, dd { margin: 0; }
h1, h2, h3 { text-wrap: balance; font-weight: 600; letter-spacing: -0.03em; }
a { color: inherit; }
img { max-width: 100%; display: block; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
::selection { background: var(--blue); color: #fff; }
.wrap { max-width: var(--maxw); margin-inline: auto; padding-inline: clamp(16px, 4vw, 40px); }
.eyebrow { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

/* ---------- floating pill nav ---------- */
.navholder { position: sticky; top: 14px; z-index: 50; display: flex; justify-content: center; margin-top: 18px; padding-inline: 12px; pointer-events: none; }
nav.site {
  pointer-events: auto; display: flex; align-items: center; gap: 2px;
  background: rgba(255,255,255,0.85); backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4);
  border: 1px solid var(--line); border-radius: 999px;
  padding: 6px 6px 6px 26px; box-shadow: 0 6px 24px -16px rgba(20,20,25,0.3);
  max-width: 100%;
}
.brand { font-family: var(--font-logo); font-weight: 700; font-size: 1.05rem; text-decoration: none; margin-right: 28px; white-space: nowrap; }
.navlinks { display: flex; align-items: center; gap: 8px; }
.navlinks a { font-size: 0.9rem; font-weight: 500; color: var(--muted); padding: 9px 18px; border-radius: 999px; text-decoration: none; transition: color .2s, background .2s; white-space: nowrap; }
.navlinks a:hover { color: var(--ink); background: var(--surface); }
.navlinks a.current { color: var(--ink); }
.navlinks a.cta { background: var(--ink); color: #fff; margin-left: 10px; }
.navlinks a.cta:hover { background: #000; color: #fff; }
@media (max-width: 560px) {
  nav.site { padding-left: 16px; }
  .brand { font-size: .92rem; margin-right: 8px; }
  .navlinks { gap: 2px; }
  .navlinks a { padding: 7px 10px; font-size: .8rem; }
  .navlinks a.cta { margin-left: 4px; }
  .navlinks .hide-sm { display: none; }
}

/* ================= HOME ================= */
.home-frame { max-width: var(--maxw); margin-inline: auto; border-inline: 1px solid var(--line); }
.hero { position: relative; display: grid; grid-template-columns: 57.5% 1fr; grid-template-columns: round(down, 57.5%, var(--cell)) 1fr; border-bottom: 1px solid var(--line); margin-top: -64px; padding-top: 64px; }
.hero-text { padding: clamp(48px, 7vw, 96px) clamp(20px, 4vw, 56px) 112px; border-right: 1px solid var(--line); }
.hero-text .spark { width: 44px; height: 44px; margin-bottom: 26px; }
.spark svg { display: block; overflow: visible; }
.spark .s { fill: url(#gold); transform-box: fill-box; transform-origin: center; animation: twinkle 2.6s ease-in-out infinite; }
.spark .s2 { animation-delay: .5s; animation-duration: 2.2s; }
.spark .s3 { animation-delay: 1.1s; animation-duration: 2.9s; }
.spark .s1 { filter: drop-shadow(0 0 0 rgba(248,194,58,0)); animation-name: twinkle-main; }
@keyframes twinkle { 0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; } 45% { transform: scale(.55) rotate(25deg); opacity: .55; } 60% { transform: scale(1.12) rotate(0deg); opacity: 1; } }
@keyframes twinkle-main { 0%, 100% { transform: scale(1) rotate(0deg); filter: drop-shadow(0 0 0 rgba(248,194,58,0)); } 50% { transform: scale(1.1) rotate(12deg); filter: drop-shadow(0 0 6px rgba(248,194,58,.55)); } }
.spark:hover .s { animation-duration: .9s; }
@media (prefers-reduced-motion: reduce) { .spark .s { animation: none; } }
.hero-text h1 { font-weight: 300; font-size: clamp(1.9rem, 3.3vw, 2.65rem); line-height: 1.2; letter-spacing: -0.022em; max-width: 21ch; text-wrap: pretty; }
.hero-text h1 b { font-weight: 500; letter-spacing: -0.03em; }
.hero-text .nb { white-space: nowrap; }
@keyframes bob { 50% { transform: translateY(5px); } }
.scroll-btn { position: absolute; left: 50%; bottom: 28px; z-index: 5; display: inline-flex; align-items: center; gap: 8px;
  padding: 11px 20px; border-radius: 999px; background: rgba(255,255,255,.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--line); box-shadow: 0 12px 32px -12px rgba(76,132,255,.55), 0 2px 8px -4px rgba(76,132,255,.25);
  font-size: .92rem; font-weight: 500; color: var(--ink); text-decoration: none; white-space: nowrap;
  transform: translateX(-50%); animation: float 2.6s ease-in-out infinite; transition: background .2s; }
.scroll-btn span { color: var(--ink); font-size: 1.05rem; }
.scroll-btn:hover { background: var(--surface); }
.scroll-btn.gone { opacity: 0 !important; pointer-events: none; transition: opacity .35s ease; }
@keyframes float { 0%, 100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, -6px); } }
@media (prefers-reduced-motion: reduce) { .scroll-btn { animation: none; } }
.hero-photo { display: grid; place-items: center; padding: 40px; }
.hero-photo img { width: min(100%, 300px); height: auto; aspect-ratio: 1; object-fit: cover; border-radius: 6px; box-shadow: 0 20px 50px -30px rgba(0,0,0,.35); }
@media (max-width: 820px) {
  .hero { grid-template-columns: 1fr; }
  .hero-text { border-right: 0; border-bottom: 1px solid var(--line); }
  .hero-photo { display: none; }
  .hero-text { padding-top: 40px; }
}

.projects {
  padding: clamp(28px, 4vw, 56px) clamp(14px, 3vw, 48px);
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: var(--cell) var(--cell); background-position: -1px -1px;
  display: grid; gap: clamp(20px, 3vw, 32px);
}
.card { display: grid; grid-template-columns: 1.15fr 1fr; background: var(--white); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; text-decoration: none; transition: box-shadow .3s, transform .3s; }
a.card:hover { box-shadow: 0 14px 34px -22px rgba(20,20,30,.16), 0 2px 6px -3px rgba(20,20,30,.06); transform: translateY(-2px); }
.card-media { position: relative; overflow: hidden; min-height: clamp(280px, 30vw, 400px);
  background: var(--white); border-right: 1px solid var(--line); }
.card-media img { position: absolute; left: 11%; top: 13%; width: 120%; max-width: none; height: auto;
  border-radius: 10px 0 0 0; border: 1px solid rgba(20,20,40,.08); box-shadow: 0 24px 50px -28px rgba(30,40,90,.35);
  transition: transform .6s cubic-bezier(.2,.7,.2,1); }
a.card:hover .card-media img { transform: translate(-8px, -8px); }
/* images that already have their own background/frame: show whole, no extra frame */
.card-media.plain img { left: 0; top: 0; width: 100%; height: 100%; padding: clamp(12px, 2vw, 28px); object-fit: contain; border: 0; border-radius: 0; box-shadow: none; }
a.card:hover .card-media.plain img { transform: scale(1.03); }
.card-body { padding: clamp(22px, 3.4vw, 48px); display: grid; align-content: center; gap: 14px; justify-items: start; }
.tag { font-size: .82rem; color: #575757; background: #F4F4F4; border-radius: 999px; padding: 4px 12px; }
.card h2 { font-size: clamp(1.25rem, 1.9vw, 1.5rem); line-height: 1.25; letter-spacing: -0.02em; }
.card p { color: var(--body); font-size: .97rem; max-width: 46ch; }
.btn { display: inline-flex; align-items: center; gap: 10px; background: var(--ink); color: #fff; font-weight: 500; font-size: .95rem; padding: 12px 24px; border-radius: 999px; margin-top: 6px; transition: gap .25s, background .25s; }
a.card:hover .btn { gap: 14px; background: #000; }
.btn.soon { background: #E2E2E2; color: #555; }
@media (max-width: 820px) {
  .card { grid-template-columns: 1fr; }
  .card-media { min-height: 0; aspect-ratio: 16 / 11; border-right: 0; border-bottom: 1px solid var(--line); }
  .card-media img { left: 8%; top: 10%; }
  .card-media.plain img { left: 0; top: 0; }
}

/* ================= CASE STUDY ================= */
.cs-head { padding-block: clamp(48px, 7vw, 96px) clamp(32px, 4vw, 48px); text-align: center; }
.cs-head .eyebrow { color: var(--accent); }
.cs-head h1 { font-size: clamp(2.4rem, 5.6vw, 4.3rem); line-height: 1.03; letter-spacing: -0.045em; max-width: 17ch; margin: 14px auto 0; }
.cs-head h1 .lt { font-weight: 300; }
.cs-head h1 b { font-weight: 700; }
.lede { margin: 22px auto 0; max-width: 58ch; font-size: clamp(1.05rem, 1.5vw, 1.18rem); color: var(--body); line-height: 1.55; }
.meta { margin-top: clamp(36px, 5vw, 56px); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0 28px; text-align: center; }
.meta div { border-top: 1px solid var(--line); padding-top: 14px; min-width: 0; }
.meta dt { font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.meta dd { margin-top: 6px; font-weight: 500; font-size: 0.95rem; }
@media (max-width: 760px) { .meta { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; } }

.hero-shot { margin-bottom: clamp(56px, 7vw, 88px); border-radius: var(--r); overflow: hidden; background: var(--surface); }
.hero-shot img { width: 100%; height: auto; }
.hero-shot.bg { background-size: cover; background-position: center; padding: clamp(16px, 4vw, 48px) clamp(16px, 6vw, 80px) 0; }

.tldr { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 40px; margin-bottom: clamp(80px, 9vw, 120px); }
.tldr article { border-top: 1px solid var(--line); padding-top: 18px; display: grid; gap: 10px; align-content: start; }
.tldr .eyebrow { color: var(--accent); }
.tldr p { color: var(--body); }
@media (max-width: 860px) { .tldr { grid-template-columns: 1fr; gap: 28px; } }

.story { display: grid; gap: clamp(88px, 10vw, 136px); }
.chapter { display: grid; justify-items: center; text-align: center; gap: clamp(14px, 1.8vw, 22px); }
.chapter + .chapter.sub { margin-top: calc(-1 * clamp(40px, 5vw, 70px)); }
.pill { display: inline-flex; align-items: center; gap: 10px; padding: 9px 22px; border-radius: 999px; background: var(--surface); border: 1px solid #EBEBED; color: #8E8E97; font-weight: 600; font-size: clamp(.92rem, 1.2vw, 1.05rem); }
.pill .n { font-family: var(--font-mono); font-weight: 500; font-size: .74rem; color: var(--accent); }
.statement { max-width: 30em; font-size: clamp(1.45rem, 2.6vw, 2.15rem); line-height: 1.22; font-weight: 600; letter-spacing: -0.025em; text-wrap: balance; }
.statement.big { font-size: clamp(2rem, 4.4vw, 3.4rem); line-height: 1.06; letter-spacing: -0.04em; max-width: 20ch; }
.statement em { font-style: normal; color: var(--accent); }
.support { max-width: 62ch; font-size: 1.05rem; color: var(--muted); line-height: 1.7; }
.note { font-size: .88rem; color: var(--muted); font-style: italic; }

.shot { width: 100%; margin-top: clamp(8px, 2vw, 20px); }
.shot img { width: 100%; height: auto; border-radius: var(--r); background: var(--surface); }
.shot.framed { background: var(--surface); border-radius: var(--r); padding: clamp(14px, 3vw, 40px); }
.shot.framed img { border-radius: 8px; background: none; }
.duo { width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(10px, 1.6vw, 20px); margin-top: clamp(8px, 2vw, 20px); }
.duo img { width: 100%; height: auto; border-radius: var(--r); background: var(--surface); }
.duo.framed > * { background: var(--surface); border-radius: var(--r); padding: clamp(12px, 2vw, 28px); display: grid; place-items: center; }
.duo.framed img { border-radius: 8px; background: none; }
.phones { width: 100%; display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: clamp(10px, 1.6vw, 20px); background: var(--surface); border-radius: var(--r); padding: clamp(18px, 3.5vw, 48px); margin-top: clamp(8px, 2vw, 20px); align-items: start; }
.phones img { width: 100%; height: auto; }
@media (max-width: 720px) { .duo { grid-template-columns: 1fr; } .phones { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.logos { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: clamp(20px, 4vw, 48px); padding: 8px 0; }
.logos img { height: 30px; width: auto; filter: grayscale(1); opacity: .65; }

.trio { list-style: none; padding: 0; width: 100%; max-width: 1000px; display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); gap: 36px 36px; text-align: left; margin-top: 10px; }
.trio > li { border-top: 1px solid var(--line); padding-top: 18px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.trio > li::before { content: counter(item, decimal-leading-zero); counter-increment: item; font-family: var(--font-mono); font-size: .72rem; color: var(--accent); }
.trio { counter-reset: item; }
.trio h3 { font-size: 1.08rem; letter-spacing: -0.02em; line-height: 1.3; }
.trio p { color: var(--muted); font-size: .96rem; }
@media (max-width: 900px) { .trio { --cols: 2 !important; } }
@media (max-width: 560px) { .trio { --cols: 1 !important; } }

/* annotated screens: image + short caption */
.screens { width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(28px, 4vw, 48px) clamp(14px, 2vw, 24px); margin-top: clamp(8px, 2vw, 20px); text-align: left; }
.screens figure { display: grid; gap: 14px; align-content: start; }
.screens img { width: 100%; height: auto; border-radius: 12px; border: 1px solid var(--line); background: var(--white); }
.screens figcaption { font-size: .93rem; color: var(--muted); }
.screens figcaption b { display: block; color: var(--ink); font-weight: 600; margin-bottom: 2px; }
.screens.phones-row { grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); background: var(--surface); border-radius: var(--r); padding: clamp(18px, 3.5vw, 44px); }
.screens.phones-row img { border: 0; background: none; border-radius: 0; }
@media (max-width: 720px) { .screens { grid-template-columns: 1fr; } .screens.phones-row { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* scene: big image with frosted caption band */
.scene { position: relative; width: 100%; border-radius: var(--r); overflow: hidden; background: #ECECEF; text-align: left; isolation: isolate; }
.scene + .scene { margin-top: clamp(20px, 3vw, 36px); }
.scene > img { width: 100%; height: auto; }
.scene-band { padding: clamp(22px, 3.4vw, 44px) clamp(22px, 4vw, 56px) clamp(24px, 3.6vw, 48px); background: #F1F1F4; display: grid; gap: 8px; }
.scene-band h3 { font-size: clamp(1.25rem, 2.2vw, 1.9rem); line-height: 1.15; letter-spacing: -0.03em; }
.scene-band p { max-width: 70ch; color: var(--body); font-size: 1rem; }
.scene .extra { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(10px, 1.6vw, 20px); padding: 0 clamp(14px, 2.4vw, 32px) clamp(14px, 2.4vw, 32px); background: #F1F1F4; }
.scene .extra img { width: 100%; height: auto; border-radius: 10px; }
@media (max-width: 720px) { .scene .extra { grid-template-columns: 1fr; } }

/* results */
.results { list-style: none; padding: 0; width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(10px, 1.6vw, 20px); text-align: left; margin-top: 10px; }
.results li { background: var(--surface); border-radius: var(--r); padding: clamp(24px, 3vw, 36px); display: grid; gap: 10px; align-content: start; }
.big-num { font-size: clamp(2.6rem, 5vw, 4rem); font-weight: 600; letter-spacing: -0.05em; line-height: 1; color: var(--ink); }
.results .eyebrow { color: var(--accent); }
.results h3 { font-size: clamp(1.1rem, 1.6vw, 1.3rem); line-height: 1.2; letter-spacing: -0.025em; }
.results p { color: var(--muted); font-size: .95rem; }
@media (max-width: 860px) { .results { grid-template-columns: 1fr; } }

/* next case study */
.next { margin-top: clamp(100px, 11vw, 150px); display: grid; justify-items: center; gap: 14px; text-align: center; text-decoration: none; }
.next .title { font-size: clamp(2.2rem, 5vw, 3.8rem); font-weight: 600; line-height: 1.03; letter-spacing: -0.045em; max-width: 18ch; }
.next .go { display: inline-flex; align-items: center; gap: 8px; margin-top: 8px; border: 1px solid var(--line); font-weight: 500; font-size: .88rem; padding: 10px 18px; border-radius: 999px; transition: background .25s, color .25s, border-color .25s; }
.next:hover .go { background: var(--ink); color: #fff; border-color: var(--ink); }

/* ================= FOOTER (shared) ================= */
.site-foot { background: #0E0E0E; color: #fff; margin-top: clamp(80px, 9vw, 130px); padding-inline: clamp(16px, 4vw, 40px); }
.foot-inner { max-width: var(--maxw); margin-inline: auto; padding-block: clamp(56px, 7vw, 96px) clamp(48px, 6vw, 80px);
  display: grid; grid-template-columns: 1fr auto; gap: 48px; align-items: end; }
.foot-title { font-size: clamp(2rem, 3.6vw, 3rem); font-weight: 300; letter-spacing: -0.022em; line-height: 1.2; }
.foot-title .hl { padding: 0 .14em .04em; margin-left: -.14em; -webkit-box-decoration-break: clone; box-decoration-break: clone;
  background: linear-gradient(var(--marker), var(--marker)) left center / 0% 100% no-repeat;
  transition: background-size 1s cubic-bezier(.7,0,.2,1) .25s, color .35s ease .55s; }
.foot-title.in .hl { background-size: 100% 100%; color: #0E0E0E; }
@media (prefers-reduced-motion: reduce) { .foot-title .hl { background-size: 100% 100%; color: #0E0E0E; transition: none; } }
.foot-links { display: flex; flex-wrap: wrap; gap: 12px 32px; margin-top: 26px; }
.foot-links a { display: inline-flex; align-items: center; gap: 8px; font-size: 1.1rem; font-weight: 500; color: #fff; text-decoration: none; }
.foot-links .ext { font-size: .9em; transition: transform .25s ease; }
.foot-links a:hover { color: rgba(255,255,255,.75); }
.foot-links a:hover .ext { transform: translate(2px, -2px); }

/* live Tel Aviv clock */
.clock { display: inline-flex; align-items: center; gap: 12px; white-space: nowrap; }
.clock-icons { position: relative; width: 22px; height: 22px; flex: none; }
.ci { position: absolute; inset: 0; width: 100%; height: 100%; fill: none; stroke: #fff; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
  opacity: 0; transform: translateY(6px) rotate(-20deg); transition: opacity .8s ease, transform .8s cubic-bezier(.2,.7,.2,1); }
.clock[data-period="sunrise"] .ci-sunrise, .clock[data-period="sun"] .ci-sun,
.clock[data-period="sunset"] .ci-sunset, .clock[data-period="moon"] .ci-moon { opacity: 1; transform: none; }
.clock[data-period="sun"] .ci-sun { animation: spin 40s linear infinite; }
.clock[data-period="moon"] .ci-moon { animation: sway 5s ease-in-out infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes sway { 50% { transform: rotate(-8deg); } }
.clock-label { font-size: 1rem; color: rgba(255,255,255,.6); }
.clock-time { font-size: 1.1rem; font-weight: 500; color: #fff; font-variant-numeric: tabular-nums; padding-left: 12px; border-left: 1px solid rgba(255,255,255,.2); }
.clock-time .colon { display: inline-block; margin: 0 1px; animation: blink 2s steps(1) infinite; }
@keyframes blink { 50% { opacity: .2; } }

oads/2025/10/Open-1-2-scaled.png\" alt=\"Money transfer platform dashboard\" loading=\"lazy\"><\/div>\n      <div class=\"card-body\">\n        <span class=\"tag\">SaaS \u2022 Mobile \u2022 Finance<\/span>\n        <h2>How companies boost their profits<\/h2>\n        <p>A platform for business users to manage their funds through transfers and currency conversions, monitor operations from a central dashboard, execute transfers, and export reports.<\/p>\n        <span class=\"btn\">View case study <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14M13 6l6 6-6 6\"/><\/svg><\/span>\n      <\/div>\n    <\/a>\n\n    <a class=\"card reveal\" href=\"#medical-students-app\">\n      <div class=\"card-media plain\"><img src=\"https://adidamari.co.il/wp-content/uploads/2025/10/Sarari-12-scaled.png\" alt=\"Medical students app screens\" loading=\"lazy\"><\/div>\n      <div class=\"card-body\">\n        <span class=\"tag\">Mobile \u2022 Medical \u2022 Academy<\/span>\n        <h2>Medical student app for hospital setting<\/h2>\n        <p>An intuitive app for medical interns with daily updates and exam and assignment tracking. A library of educational videos supports their professional development.<\/p>\n        <span class=\"btn\">View case study <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14M13 6l6 6-6 6\"/><\/svg><\/span>\n      <\/div>\n    <\/a>\n  <\/section>\n<\/div>\n\n<footer class=\"site-foot\" id=\"contact\">\n  <div class=\"foot-inner\">\n    <div class=\"foot-main\">\n      <h2 class=\"foot-title reveal\"><span class=\"hl\">Let\u2019s Connect.<\/span><\/h2>\n      <div class=\"foot-links\">\n        <a href=\"https://api.whatsapp.com/send?phone=972507307688\" target=\"_blank\" rel=\"noopener\">WhatsApp <span class=\"ext\" aria-hidden=\"true\">\u2197<\/span><\/a>\n        <a href=\"https://www.linkedin.com/in/adi-elbom/\" target=\"_blank\" rel=\"noopener\">LinkedIn <span class=\"ext\" aria-hidden=\"true\">\u2197<\/span><\/a>\n        <a href=\"mailto:adi.elbom3@gmail.com\">Email <span class=\"ext\" aria-hidden=\"true\">\u2197<\/span><\/a>\n      <\/div>\n    <\/div>\n    <div class=\"clock\" id=\"clock\" aria-live=\"off\">\n        <span class=\"clock-icons\" aria-hidden=\"true\">\n          <svg class=\"ci ci-sunrise\" viewBox=\"0 0 32 32\"><path d=\"M4 23h24M9 23a7 7 0 0 1 14 0\"/><path d=\"M16 9v3M7.5 13.5l2 2M24.5 13.5l-2 2M3.5 19h2.5M26 19h2.5\"/><path d=\"M13 6l3-3 3 3\"/><\/svg>\n          <svg class=\"ci ci-sun\" viewBox=\"0 0 32 32\"><circle cx=\"16\" cy=\"16\" r=\"5.5\"/><path d=\"M16 3v3.5M16 25.5V29M3 16h3.5M25.5 16H29M6.8 6.8l2.5 2.5M22.7 22.7l2.5 2.5M6.8 25.2l2.5-2.5M22.7 9.3l2.5-2.5\"/><\/svg>\n          <svg class=\"ci ci-sunset\" viewBox=\"0 0 32 32\"><path d=\"M4 23h24M9 23a7 7 0 0 1 14 0\"/><path d=\"M16 9v3M7.5 13.5l2 2M24.5 13.5l-2 2M3.5 19h2.5M26 19h2.5\"/><path d=\"M13 27l3 3 3-3\"/><\/svg>\n          <svg class=\"ci ci-moon\" viewBox=\"0 0 32 32\"><path d=\"M21.5 20.5A9.5 9.5 0 0 1 11.5 6a10 10 0 1 0 14 13.5 9.4 9.4 0 0 1-4 1Z\"/><path d=\"M23 5.5v3M21.5 7h3M26.5 11v2M25.5 12h2\"/><\/svg>\n        <\/span>\n        <span class=\"clock-label\">Local time \u00b7 Tel Aviv<\/span>\n        <span class=\"clock-time\"><span class=\"hh\">--<\/span><span class=\"colon\">:<\/span><span class=\"mm\">--<\/span><\/span>\n    <\/div>\n  <\/div>\n  <div class=\"foot-bottom\">\n    <span>\u00a9 2026 Adi Elbom Dam Ari \u00b7 Product Designer<\/span>\n    <a href=\"#top\" onclick=\"window.scrollTo({top:0,behavior:'smooth'});return false;\">Back to top \u2191<\/a>\n  <\/div>\n<\/footer>\n", "nft-admin": "\n<div class=\"navholder\">\n  <nav class=\"site\" aria-label=\"Main\">\n    <a class=\"brand\" href=\"#home\">Adi Elbom.<\/a>\n    <div class=\"navlinks\">\n      <a href=\"#work\">Work<\/a>\n      <a href=\"https://drive.google.com/file/d/1dUDBJgoNw1x8Hw4QgFYmObVrlOSRtjmj/view\" target=\"_blank\" rel=\"noopener\">Resume<\/a>\n      <a class=\"hide-sm\" href=\"https://www.linkedin.com/in/adi-elbom/\" target=\"_blank\" rel=\"noopener\">LinkedIn<\/a>\n      <a class=\"cta\" href=\"https://api.whatsapp.com/send?phone=972507307688\" target=\"_blank\" rel=\"noopener\">Let\u2019s chat<\/a>\n    <\/div>\n  <\/nav>\n<\/div>\n\n<main class=\"wrap\">\n  <header class=\"cs-head\">\n    <p class=\"eyebrow\">Case study \u00b7 SaaS \u00b7 Admin \u00b7 Blockchain<\/p>\n    <h1><span class=\"lt\">An NFT admin platform,<\/span> <b>built from scratch<\/b><\/h1>\n    <p class=\"lede\">A B2B admin system for a heritage organization selling digital collectibles to reach a younger, more diverse audience of donors.<\/p>\n    <dl class=\"meta\">\n      <div><dt>Role<\/dt><dd>Product Designer<\/dd><\/div>\n      <div><dt>Team<\/dt><dd>PM, designer, project &amp; dev teams<\/dd><\/div>\n      <div><dt>Scope<\/dt><dd>Research, UX, wireframes, UI<\/dd><\/div>\n      <div><dt>Platform<\/dt><dd>Desktop web (B2B)<\/dd><\/div>\n    <\/dl>\n  <\/header>\n\n  <figure class=\"hero-shot\"><img src=\"https://adidamari.co.il/wp-content/uploads/2025/10/Sarari-Dark-8889-scaled.png\" alt=\"NFT admin platform, dashboard overview\"><\/figure>\n\n  <section class=\"tldr\">\n    <article><p class=\"eyebrow\">The challenge<\/p><p>How can a legacy organization launch an emotional, donation-based experience using cutting-edge NFT technology, with no existing reference, and without compromising the spirit of giving?<\/p><\/article>\n    <article><p class=\"eyebrow\">The company<\/p><p>Israel\u2019s largest organization for historical sites and artifacts, funded by donations, now selling digital items to reach a new generation of donors.<\/p><\/article>\n    <article><p class=\"eyebrow\">The project<\/p><p>An admin system for item management, donor details, financial reports and donation approval, all run by an internal employee.<\/p><\/article>\n  <\/section>\n\n  <div class=\"story\">\n    <section class=\"chapter reveal\">\n      <p class=\"pill\"><span class=\"n\">01<\/span>Exploring the problem<\/p>\n      <p class=\"statement\">We had to create a product from scratch, with <em>no references<\/em> for admin systems in the NFT world, especially for donations.<\/p>\n      <p class=\"support\">We brainstormed before and during research, focusing on admin systems in NFT marketplaces and online stores to understand the hierarchy from collection to item.<\/p>\n      <div class=\"duo\"><img src=\"https://adidamari.co.il/wp-content/uploads/2025/10/Frame-12436-scaled.webp\" alt=\"Brainstorm board\" loading=\"lazy\"><img src=\"https://adidamari.co.il/wp-content/uploads/2025/10/Frame-12435678-scaled.webp\" alt=\"Research mapping\" loading=\"lazy\"><\/div>\n    <\/section>\n\n    <section class=\"chapter sub reveal\">\n      <p class=\"pill\">Market research<\/p>\n      <p class=\"support\">We studied the admin systems of large online-marketplace platforms such as Shopify, Wix, Magento and BigCommerce to learn how they are built and which features work. Since we were starting from zero, this told us where to begin.<\/p>\n      <div class=\"duo framed\"><div><img src=\"https://adidamari.co.il/wp-content/uploads/2025/10/SSS.png\" alt=\"Competitor analysis\" loading=\"lazy\"><\/div><div><img src=\"https://adidamari.co.il/wp-content/uploads/2025/10/SS.png\" alt=\"Competitor feature comparison\" loading=\"lazy\"><\/div><\/div>\n    <\/section>\n\n    <section class=\"chapter reveal\">\n      <p class=\"pill\"><span class=\"n\">02<\/span>Key insights<\/p>\n      <p class=\"statement big\">Give staff <em>full control<\/em>, without relying on developers.<\/p>\n      <ul class=\"trio\" style=\"--cols:4\">\n        <li><h3>Own the storefront<\/h3><p>Full control over item uploads and storefront visibility, without developers.<\/p><\/li>\n        <li><h3>Real-time data<\/h3><p>Live data and exportable reports to evaluate engagement and impact.<\/p><\/li>\n        <li><h3>Drops that build hype<\/h3><p>Limited-edition NFT drops to raise anticipation around key dates.<\/p><\/li>\n        <li><h3>Built to scale<\/h3><p>A flexible foundation for future holidays and global donors.<\/p><\/li>\n      <\/ul>\n    <\/section>\n\n    <section class=\"chapter reveal\">\n      <p class=\"pill\"><span class=\"n\">03<\/span>User journey<\/p>\n      <p class=\"statement\">One flow in detail: creating <em>collections and items<\/em>.<\/p>\n      <p class=\"support\">The flow guides the user through crafting historical items, categorizing them accurately, and organizing the catalog, collections and items in a clear hierarchy, so the collections stay complete and easy to navigate.<\/p>\n      <figure class=\"shot framed\"><img src=\"https://adidamari.co.il/wp-content/uploads/2025/03/Group-1000004770-1.png\" alt=\"User flow for collections and items\" loading=\"lazy\"><\/figure>\n      <p class=\"note\">This is one use case of the full system. Feel free to contact me to learn more.<\/p>\n    <\/section>\n\n    <section class=\"chapter reveal\">\n      <p class=\"pill\"><span class=\"n\">04<\/span>Wireframing<\/p>\n      <p class=\"statement\">From hand sketches to <em>high-fidelity<\/em> wireframes.<\/p>\n      <p class=\"support\">After exploring directions in hand sketches, I moved to high-fidelity wireframes of the key screens: the dashboard and the donor purchase completion flow.<\/p>\n      <div class=\"screens\">\n        <figure><img src=\"https://adidamari.co.il/wp-content/uploads/2024/12/sc13.png\" alt=\"Dashboard wireframe\" loading=\"lazy\"><figcaption><b>Home dashboard<\/b>Real-time user tracking, top NFT items, key data highlights and a donations graph over time.<\/figcaption><\/figure>\n        <figure><img src=\"https://adidamari.co.il/wp-content/uploads/2024/12/%D7%A1%D7%A1%D7%A1%D7%A1.png\" alt=\"Edit NFT item wireframe\" loading=\"lazy\"><figcaption><b>Editing an NFT item<\/b>Adding item characteristics and viewing the item\u2019s activity.<\/figcaption><\/figure>\n        <figure><img src=\"https://adidamari.co.il/wp-content/uploads/2024/12/sc14.png\" alt=\"Donor profile wireframe\" loading=\"lazy\"><figcaption><b>Donor profile<\/b>The donor\u2019s item activity and finalizing a winning item.<\/figcaption><\/figure>\n        <figure><img src=\"https://adidamari.co.il/wp-content/uploads/2024/09/ux-5.png\" alt=\"NFT item preview pop-up wireframe\" loading=\"lazy\"><figcaption><b>Donor profile \u00b7 item preview<\/b>A preview pop-up of an NFT item.<\/figcaption><\/figure>\n        <figure><img src=\"https://adidamari.co.il/wp-content/uploads/2024/12/sss.png\" alt=\"Donation completion wireframe\" loading=\"lazy\"><figcaption><b>Complete donation<\/b>The first step in finalizing a won NFT item.<\/figcaption><\/figure>\n      <\/div>\n    <\/section>\n\n    <section class=\"chapter reveal\">\n      <p class=\"pill\"><span class=\"n\">05<\/span>Visual design<\/p>\n      <p class=\"statement\">Minimal admin, <em>bright NFT world<\/em>.<\/p>\n      <p class=\"support\">With the team and the client, we chose a minimalistic UI built on shades of the company\u2019s primary logo color plus a complementary accent. The marketplace leans into the NFT world: bright colors on a dark-mode base.<\/p>\n      <figure class=\"shot\"><img src=\"https://adidamari.co.il/wp-content/uploads/2025/10/12-scaled.png\" alt=\"Design system\" loading=\"lazy\"><\/figure>\n    <\/section>\n\n    <section class=\"chapter reveal\">\n      <p class=\"pill\">The final screens<\/p>\n      <p class=\"support\">Representative use cases the internal team performs every day.<\/p>\n      <figure class=\"scene\">\n        <img src=\"https://adidamari.co.il/wp-content/uploads/2024/12/Sarari-Dark-4.png\" alt=\"Home dashboard\" loading=\"lazy\">\n        <figcaption class=\"scene-band\"><h3>Home dashboard<\/h3><p>Summarizes everything coming in from the marketplace: number of users, returning donors who bought multiple items, the most popular items, and a trend graph over time.<\/p><\/figcaption>\n      <\/figure>\n      <figure class=\"scene\">\n        <img src=\"https://adidamari.co.il/wp-content/uploads/2025/10/dddssss-scaled.webp\" alt=\"Collections table\" loading=\"lazy\">\n        <figcaption class=\"scene-band\"><h3>Add &amp; view collections<\/h3><p>All collections in one table: open, edit, attach items, and publish or deactivate a collection in the marketplace in one click.<\/p><\/figcaption>\n        <div class=\"extra\"><img src=\"https://adidamari.co.il/wp-content/uploads/2025/10/aaa-scaled.webp\" alt=\"Collection detail\" loading=\"lazy\"><\/div>\n      <\/figure>\n      <figure class=\"scene\">\n        <img src=\"https://adidamari.co.il/wp-content/uploads/2025/10/big-screen1-scaled.webp\" alt=\"Items table\" loading=\"lazy\">\n        <figcaption class=\"scene-band\"><h3>Add &amp; view items<\/h3><p>Every item with its main information: open, edit, remove from the marketplace, or turn it back into a draft.<\/p><\/figcaption>\n        <div class=\"extra\"><img src=\"https://adidamari.co.il/wp-content/uploads/2025/04/flow-nft.png\" alt=\"Item creation flow\" loading=\"lazy\"><\/div>\n      <\/figure>\n      <figure class=\"scene\">\n        <img src=\"https://adidamari.co.il/wp-content/uploads/2025/10/sssss-scaled.webp\" alt=\"Donor purchase completion\" loading=\"lazy\">\n        <figcaption class=\"scene-band\"><h3>Donor lead \u00b7 NFT item purchase<\/h3><p>The marketplace ran on NFT drops and raffles, so each winner had a final transaction to complete. This is how that process looks.<\/p><\/figcaption>\n        <div class=\"extra\"><img src=\"https://adidamari.co.il/wp-content/uploads/2024/12/sc5-2.png\" alt=\"Purchase completion detail\" loading=\"lazy\"><\/div>\n      <\/figure>\n    <\/section>\n\n    <section class=\"chapter reveal\">\n      <p class=\"pill\"><span class=\"n\">06<\/span>Impact<\/p>\n      <p class=\"statement\">Non-technical teams now create and manage NFTs <em>at scale<\/em>, on their own.<\/p>\n      <ul class=\"results\">\n        <li><span class=\"big-num\">27%<\/span><p class=\"eyebrow\">Faster creation<\/p><h3>Time to complete the creation flow<\/h3><p>A step-by-step flow with live previews cut the average completion time (estimated).<\/p><\/li>\n        <li><span class=\"big-num\">30%<\/span><p class=\"eyebrow\">More consistent<\/p><h3>Consistency through templates<\/h3><p>Predefined templates simplified creation and reduced errors (estimated).<\/p><\/li>\n        <li><span class=\"big-num\">~3<\/span><p class=\"eyebrow\">Fewer errors per session<\/p><h3>Fewer data-entry mistakes<\/h3><p>Validations, field restrictions and in-context guidance reduced manual corrections.<\/p><\/li>\n      <\/ul>\n    <\/section>\n  <\/div>\n\n  <a class=\"next reveal\" href=\"#money-transfer-platform\">\n    <span class=\"eyebrow\">Next case study<\/span>\n    <span class=\"title\">Boosting companies\u2019 profits<\/span>\n    <span class=\"go\">View case study <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14M13 6l6 6-6 6\"/><\/svg><\/span>\n  <\/a>\n<\/main>\n\n<footer class=\"site-foot\" id=\"contact\">\n  <div class=\"foot-inner\">\n    <div class=\"foot-main\">\n      <h2 class=\"foot-title reveal\"><span class=\"hl\">Let\u2019s Connect.<\/span><\/h2>\n      <div class=\"foot-links\">\n        <a href=\"https://api.whatsapp.com/send?phone=972507307688\" target=\"_blank\" rel=\"noopener\">WhatsApp <span class=\"ext\" aria-hidden=\"true\">\u2197<\/span><\/a>\n        <a href=\"https://www.linkedin.com/in/adi-elbom/\" target=\"_blank\" rel=\"noopener\">LinkedIn <span class=\"ext\" aria-hidden=\"true\">\u2197<\/span><\/a>\n        <a href=\"mailto:adi.elbom3@gmail.com\">Email <span class=\"ext\" aria-hidden=\"true\">\u2197<\/span><\/a>\n      <\/div>\n    <\/div>\n    <div class=\"clock\" id=\"clock\" aria-live=\"off\">\n        <span class=\"clock-icons\" aria-hidden=\"true\">\n          <svg class=\"ci ci-sunrise\" viewBox=\"0 0 32 32\"><path d=\"M4 23h24M9 23a7 7 0 0 1 14 0\"/><path d=\"M16 9v3M7.5 13.5l2 2M24.5 13.5l-2 2M3.5 19h2.5M26 19h2.5\"/><path d=\"M13 6l3-3 3 3\"/><\/svg>\n          <svg class=\"ci ci-sun\" viewBox=\"0 0 32 32\"><circle cx=\"16\" cy=\"16\" r=\"5.5\"/><path d=\"M16 3v3.5M16 25.5V29M3 16h3.5M25.5 16H29M6.8 6.8l2.5 2.5M22.7 22.7l2.5 2.5M6.8 25.2l2.5-2.5M22.7 9.3l2.5-2.5\"/><\/svg>\n          <svg class=\"ci ci-sunset\" viewBox=\"0 0 32 32\"><path d=\"M4 23h24M9 23a7 7 0 0 1 14 0\"/><path d=\"M16 9v3M7.5 13.5l2 2M24.5 13.5l-2 2M3.5 19h2.5M26 19h2.5\"/><path d=\"M13 27l3 3 3-3\"/><\/svg>\n          <svg class=\"ci ci-moon\" viewBox=\"0 0 32 32\"><path d=\"M21.5 20.5A9.5 9.5 0 0 1 11.5 6a10 10 0 1 0 14 13.5 9.4 9.4 0 0 1-4 1Z\"/><path d=\"M23 5.5v3M21.5 7h3M26.5 11v2M25.5 12h2\"/><\/svg>\n        <\/span>\n        <span class=\"clock-label\">Local time \u00b7 Tel Aviv<\/span>\n        <span class=\"clock-time\"><span class=\"hh\">--<\/span><span class=\"colon\">:<\/span><span class=\"mm\">--<\/span><\/span>\n    <\/div>\n  <\/div>\n  <div class=\"foot-bottom\">\n    <span>\u00a9 2026 Adi Elbom Dam Ari \u00b7 Product Designer<\/span>\n    <a href=\"#top\" onclick=\"window.scrollTo({top:0,behavior:'smooth'});return false;\">Back to top \u2191<\/a>\n  <\/div>\n<\/footer>\n", "money-transfer-platform": "\n<div class=\"navholder\">\n  <nav class=\"site\" aria-label=\"Main\">\n    <a class=\"brand\" href=\"#home\">Adi Elbom.<\/a>\n    <div class=\"navlinks\">\n      <a href=\"#work\">Work<\/a>\n      <a href=\"https://drive.google.com/file/d/1dUDBJgoNw1x8Hw4QgFYmObVrlOSRtjmj/view\" target=\"_blank\" rel=\"noopener\">Resume<\/a>\n      <a class=\"hide-sm\" href=\"https://www.linkedin.com/in/adi-elbom/\" target=\"_blank\" rel=\"noopener\">LinkedIn<\/a>\n      <a class=\"cta\" href=\"https://api.whatsapp.com/send?phone=972507307688\" target=\"_blank\" rel=\"noopener\">Let\u2019s chat<\/a>\n    <\/div>\n  <\/nav>\n<\/div>\n\n<main class=\"wrap\">\n  <header class=\"cs-head\">\n    <p class=\"eyebrow\">Case study \u00b7 SaaS \u00b7 Mobile \u00b7 Finance<\/p>\n    <h1><span class=\"lt\">Money transfers for business,<\/span> <b>without the friction<\/b><\/h1>\n    <p class=\"lede\">A B2B platform where business users manage funds through transfers and currency conversions, track operations from one dashboard, and export reports.<\/p>\n    <dl class=\"meta\">\n      <div><dt>Role<\/dt><dd>Product Designer<\/dd><\/div>\n      <div><dt>Team<\/dt><dd>PM, 2 product designers, dev team<\/dd><\/div>\n      <div><dt>Scope<\/dt><dd>Research, UX, UI, mobile<\/dd><\/div>\n      <div><dt>Platform<\/dt><dd>Desktop web + mobile<\/dd><\/div>\n    <\/dl>\n  <\/header>\n\n  <figure class=\"hero-shot\"><img src=\"https://adidamari.co.il/wp-content/uploads/2025/10/Open-1-2-scaled.png\" alt=\"Money transfer platform dashboard\"><\/figure>\n\n  <section class=\"tldr\">\n    <article><p class=\"eyebrow\">The challenge<\/p><p>How do you give business clients a seamless, transparent way to transfer large sums, competing with global giants while keeping fees low and frustration out?<\/p><\/article>\n    <article><p class=\"eyebrow\">The company<\/p><p>One of Israel\u2019s leading financial groups, active in insurance, asset and investment management, credit and distribution.<\/p><\/article>\n    <article><p class=\"eyebrow\">Impact<\/p><p>~25% growth in engagement, ~30% shorter transaction times, and 23% of new users paying in their first session.<\/p><\/article>\n  <\/section>\n\n  <div class=\"story\">\n    <section class=\"chapter reveal\">\n      <p class=\"pill\"><span class=\"n\">01<\/span>Exploring the problem<\/p>\n      <p class=\"statement\">A great experience for <em>specific customer needs<\/em>, under real delivery pressure.<\/p>\n      <p class=\"support\">The research was done by another product designer and me, with daily feedback from our product manager, alongside an ongoing development process that demanded a lot of the team\u2019s time.<\/p>\n      <div class=\"logos\">\n        <img src=\"https://adidamari.co.il/wp-content/uploads/2025/04/pngwing.com-2-scaled.png\" alt=\"\" loading=\"lazy\">\n        <img src=\"https://adidamari.co.il/wp-content/uploads/2025/05/Group-scaled.png\" alt=\"\" loading=\"lazy\">\n        <img src=\"https://adidamari.co.il/wp-content/uploads/2024/12/Group-1.svg\" alt=\"\" loading=\"lazy\">\n        <img src=\"https://adidamari.co.il/wp-content/uploads/2025/04/Tipalti_logo-1.png\" alt=\"Tipalti\" loading=\"lazy\">\n        <img src=\"https://adidamari.co.il/wp-content/uploads/2025/05/Oradian-Brand-Mark@2x-1-scaled.png\" alt=\"Oradian\" loading=\"lazy\">\n      <\/div>\n    <\/section>\n\n    <section class=\"chapter sub reveal\">\n      <p class=\"pill\">Market research<\/p>\n      <p class=\"support\">We examined B2B money-transfer and currency-exchange platforms such as Currencycloud, OFX and Payoneer to understand how their systems are built and what makes them effective. Building from scratch, we needed to know which features our customers would expect.<\/p>\n      <div class=\"duo framed\"><div><img src=\"https://adidamari.co.il/wp-content/uploads/2025/10/pro-1.png\" alt=\"Competitor analysis\" loading=\"lazy\"><\/div><div><img src=\"https://adidamari.co.il/wp-content/uploads/2025/10/pro-2.png\" alt=\"Competitor feature comparison\" loading=\"lazy\"><\/div><\/div>\n    <\/section>\n\n    <section class=\"chapter reveal\">\n      <p class=\"pill\"><span class=\"n\">02<\/span>Key insights<\/p>\n      <p class=\"statement big\">Low fees are not enough. It has to be <em>easy to use<\/em>.<\/p>\n      <ul class=\"trio\" style=\"--cols:4\">\n        <li><h3>Robust admin<\/h3><p>Support operational efficiency and real-time transaction monitoring.<\/p><\/li>\n        <li><h3>Beat the giants<\/h3><p>Combine low fees with high usability as a real alternative to global fintechs.<\/p><\/li>\n        <li><h3>Track everything<\/h3><p>Manage and follow past and pending transactions efficiently.<\/p><\/li>\n        <li><h3>Fit the ecosystem<\/h3><p>Integrate with existing financial systems and compliance requirements.<\/p><\/li>\n      <\/ul>\n    <\/section>\n\n    <section class=\"chapter reveal\">\n      <p class=\"pill\"><span class=\"n\">03<\/span>User journey<\/p>\n      <p class=\"statement\">Adding a beneficiary, with <em>validation at every step<\/em>.<\/p>\n      <p class=\"support\">Each step of adding a new beneficiary for future transfers is validated and approved by the back office, to make sure the beneficiary is legitimate.<\/p>\n      <figure class=\"shot framed\"><img src=\"https://adidamari.co.il/wp-content/uploads/2025/04/ftt-scaled.png\" alt=\"Add beneficiary flow\" loading=\"lazy\"><\/figure>\n    <\/section>\n\n    <section class=\"chapter sub reveal\">\n      <p class=\"pill\">Open pending requests<\/p>\n      <p class=\"support\">Pending requests let the user decide what happens next: requests awaiting authorization can be handed to an admin for final processing, while requests that need no action are view-only.<\/p>\n      <figure class=\"shot framed\"><img src=\"https://adidamari.co.il/wp-content/uploads/2025/03/11-1.png\" alt=\"Pending requests flow\" loading=\"lazy\"><\/figure>\n      <p class=\"note\">These are selected use cases of the full system. Feel free to contact me to learn more.<\/p>\n    <\/section>\n\n    <section class=\"chapter reveal\">\n      <p class=\"pill\"><span class=\"n\">04<\/span>Wireframing<\/p>\n      <p class=\"statement\">Hand sketches first, then <em>high-fidelity<\/em> wireframes.<\/p>\n      <div class=\"screens\">\n        <figure><img src=\"https://adidamari.co.il/wp-content/uploads/2024/09/11-1.png\" alt=\"Dashboard wireframe\" loading=\"lazy\"><figcaption><b>Home dashboard<\/b>Recent and pending actions, the user\u2019s financial data graph, and live currency exchange rates.<\/figcaption><\/figure>\n        <figure><img src=\"https://adidamari.co.il/wp-content/uploads/2024/09/66.png\" alt=\"Dashboard wireframe variation\" loading=\"lazy\"><figcaption><b>Home dashboard \u00b7 details<\/b>Exploring how balance and actions sit together.<\/figcaption><\/figure>\n        <figure><img src=\"https://adidamari.co.il/wp-content/uploads/2024/12/2.6-Beneficiaries-profile.png\" alt=\"Beneficiary transfers wireframe\" loading=\"lazy\"><figcaption><b>Beneficiary transfers<\/b>Monthly transfer history summary and a connection-note feature.<\/figcaption><\/figure>\n        <figure><img src=\"https://adidamari.co.il/wp-content/uploads/2024/09/33.png\" alt=\"Reports wireframe\" loading=\"lazy\"><figcaption><b>Reports<\/b>User-specific filters, customizable views, downloading and sharing.<\/figcaption><\/figure>\n        <figure><img src=\"https://adidamari.co.il/wp-content/uploads/2024/10/Sarari-Dark.png\" alt=\"Report view wireframe\" loading=\"lazy\"><figcaption><b>Reports \u00b7 view<\/b>List and preview modes; pick and check reports before opening them.<\/figcaption><\/figure>\n      <\/div>\n    <\/section>\n\n    <section class=\"chapter reveal\">\n      <p class=\"pill\"><span class=\"n\">05<\/span>Visual design<\/p>\n      <p class=\"statement\">The company\u2019s brand, <em>tuned for a financial tool<\/em>.<\/p>\n      <p class=\"support\">A minimalistic approach using the company\u2019s UI brand in various shades plus one accent color. We built on the existing colors and fonts, with targeted adjustments for the system\u2019s needs, strengthening the brand\u2019s presence.<\/p>\n      <figure class=\"shot\"><img src=\"https://adidamari.co.il/wp-content/uploads/2025/04/%D7%A6%D7%99%D7%9C%D7%95%D7%9D-%D7%9E%D7%A1%D7%9A-2025-04-02-%D7%91-18.16.01.png\" alt=\"Design system\" loading=\"lazy\"><\/figure>\n    <\/section>\n\n    <section class=\"chapter reveal\">\n      <p class=\"pill\">The final screens \u00b7 Desktop<\/p>\n      <figure class=\"scene\">\n        <img src=\"https://adidamari.co.il/wp-content/uploads/2025/05/open-2-2-2-scaled.png\" alt=\"Home dashboard\" loading=\"lazy\">\n        <figcaption class=\"scene-band\"><h3>Home dashboard<\/h3><p>The system works on the user\u2019s balance, so actions depend on available funds. The dashboard shows the live balance and its value against other currencies; hovering reveals recent actions and the option to add funds.<\/p><\/figcaption>\n      <\/figure>\n      <figure class=\"scene\">\n        <img src=\"https://adidamari.co.il/wp-content/uploads/2025/06/big-1-1-scaled.png\" alt=\"Beneficiaries\" loading=\"lazy\">\n        <figcaption class=\"scene-band\"><h3>Beneficiaries \u00b7 add &amp; pay<\/h3><p>Beneficiaries handle transactions like payments and conversions. They are created and approved through the admin system first, then they are ready to go.<\/p><\/figcaption>\n        <div class=\"extra\"><img src=\"https://adidamari.co.il/wp-content/uploads/2025/06/big-2-1.png\" alt=\"Beneficiary payment\" loading=\"lazy\"><\/div>\n      <\/figure>\n      <figure class=\"scene\">\n        <img src=\"https://adidamari.co.il/wp-content/uploads/2025/06/big-3-scaled.png\" alt=\"Pending requests\" loading=\"lazy\">\n        <figcaption class=\"scene-band\"><h3>Pending requests<\/h3><p>All open requests and those that hit an issue with the admin-side controller. Requests waiting on the user are separated from those still open, so the next step is always clear.<\/p><\/figcaption>\n        <div class=\"extra\"><img src=\"https://adidamari.co.il/wp-content/uploads/2025/06/big-4-scaled.png\" alt=\"Pending request detail\" loading=\"lazy\"><\/div>\n      <\/figure>\n      <figure class=\"scene\">\n        <img src=\"https://adidamari.co.il/wp-content/uploads/2025/06/big-5-scaled.png\" alt=\"Activity\" loading=\"lazy\">\n        <figcaption class=\"scene-band\"><h3>Activity<\/h3><p>Every operation, past and present, in one place, with filters to focus on exactly what the user wants to check and track.<\/p><\/figcaption>\n        <div class=\"extra\"><img src=\"https://adidamari.co.il/wp-content/uploads/2025/06/big-6-scaled.png\" alt=\"Activity filters\" loading=\"lazy\"><\/div>\n      <\/figure>\n    <\/section>\n\n    <section class=\"chapter reveal\">\n      <p class=\"pill\">The final screens \u00b7 Mobile<\/p>\n      <p class=\"statement\">Translating dense tables and <em>complex flows<\/em> to a phone.<\/p>\n      <p class=\"support\">The mobile app carries over the comprehensive tables and the money-transfer process, the hardest parts of the system to fit on a small screen.<\/p>\n      <div class=\"phones\" style=\"--n:5\">\n        <img src=\"https://adidamari.co.il/wp-content/uploads/2025/06/screen-m2.png\" alt=\"Mobile screen\" loading=\"lazy\">\n        <img src=\"https://adidamari.co.il/wp-content/uploads/2025/06/screen-m4.png\" alt=\"Mobile screen\" loading=\"lazy\">\n        <img src=\"https://adidamari.co.il/wp-content/uploads/2025/06/screen-m8.png\" alt=\"Mobile screen\" loading=\"lazy\">\n        <img src=\"https://adidamari.co.il/wp-content/uploads/2025/06/screen-m6.png\" alt=\"Mobile screen\" loading=\"lazy\">\n        <img src=\"https://adidamari.co.il/wp-content/uploads/2025/06/screen-m44.png\" alt=\"Mobile screen\" loading=\"lazy\">\n      <\/div>\n    <\/section>\n\n    <section class=\"chapter reveal\">\n      <p class=\"pill\"><span class=\"n\">06<\/span>Key outcomes<\/p>\n      <p class=\"statement\">Complex fund transfers became a <em>secure, self-service<\/em> platform.<\/p>\n      <ul class=\"results\">\n        <li><span class=\"big-num\">25%<\/span><p class=\"eyebrow\">Estimated growth<\/p><h3>Higher engagement<\/h3><p>Business clients significantly increased their usage since launch.<\/p><\/li>\n        <li><span class=\"big-num\">30%<\/span><p class=\"eyebrow\">Approximately<\/p><h3>Shorter transaction times<\/h3><p>Faster transfers, better efficiency and higher satisfaction.<\/p><\/li>\n        <li><span class=\"big-num\">23%<\/span><p class=\"eyebrow\">Paid in first session<\/p><h3>Onboarding to paid<\/h3><p>Users who started sign-up chose a payment plan in their first session or soon after.<\/p><\/li>\n      <\/ul>\n    <\/section>\n  <\/div>\n\n  <a class=\"next reveal\" href=\"#medical-students-app\">\n    <span class=\"eyebrow\">Next case study<\/span>\n    <span class=\"title\">Medical students app<\/span>\n    <span class=\"go\">View case study <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14M13 6l6 6-6 6\"/><\/svg><\/span>\n  <\/a>\n<\/main>\n\n<footer class=\"site-foot\" id=\"contact\">\n  <div class=\"foot-inner\">\n    <div class=\"foot-main\">\n      <h2 class=\"foot-title reveal\"><span class=\"hl\">Let\u2019s Connect.<\/span><\/h2>\n      <div class=\"foot-links\">\n        <a href=\"https://api.whatsapp.com/send?phone=972507307688\" target=\"_blank\" rel=\"noopener\">WhatsApp <span class=\"ext\" aria-hidden=\"true\">\u2197<\/span><\/a>\n        <a href=\"https://www.linkedin.com/in/adi-elbom/\" target=\"_blank\" rel=\"noopener\">LinkedIn <span class=\"ext\" aria-hidden=\"true\">\u2197<\/span><\/a>\n        <a href=\"mailto:adi.elbom3@gmail.com\">Email <span class=\"ext\" aria-hidden=\"true\">\u2197<\/span><\/a>\n      <\/div>\n    <\/div>\n    <div class=\"clock\" id=\"clock\" aria-live=\"off\">\n        <span class=\"clock-icons\" aria-hidden=\"true\">\n          <svg class=\"ci ci-sunrise\" viewBox=\"0 0 32 32\"><path d=\"M4 23h24M9 23a7 7 0 0 1 14 0\"/><path d=\"M16 9v3M7.5 13.5l2 2M24.5 13.5l-2 2M3.5 19h2.5M26 19h2.5\"/><path d=\"M13 6l3-3 3 3\"/><\/svg>\n          <svg class=\"ci ci-sun\" viewBox=\"0 0 32 32\"><circle cx=\"16\" cy=\"16\" r=\"5.5\"/><path d=\"M16 3v3.5M16 25.5V29M3 16h3.5M25.5 16H29M6.8 6.8l2.5 2.5M22.7 22.7l2.5 2.5M6.8 25.2l2.5-2.5M22.7 9.3l2.5-2.5\"/><\/svg>\n          <svg class=\"ci ci-sunset\" viewBox=\"0 0 32 32\"><path d=\"M4 23h24M9 23a7 7 0 0 1 14 0\"/><path d=\"M16 9v3M7.5 13.5l2 2M24.5 13.5l-2 2M3.5 19h2.5M26 19h2.5\"/><path d=\"M13 27l3 3 3-3\"/><\/svg>\n          <svg class=\"ci ci-moon\" viewBox=\"0 0 32 32\"><path d=\"M21.5 20.5A9.5 9.5 0 0 1 11.5 6a10 10 0 1 0 14 13.5 9.4 9.4 0 0 1-4 1Z\"/><path d=\"M23 5.5v3M21.5 7h3M26.5 11v2M25.5 12h2\"/><\/svg>\n        <\/span>\n        <span class=\"clock-label\">Local time \u00b7 Tel Aviv<\/span>\n        <span class=\"clock-time\"><span class=\"hh\">--<\/span><span class=\"colon\">:<\/span><span class=\"mm\">--<\/span><\/span>\n    <\/div>\n  <\/div>\n  <div class=\"foot-bottom\">\n    <span>\u00a9 2026 Adi Elbom Dam Ari \u00b7 Product Designer<\/span>\n    <a href=\"#top\" onclick=\"window.scrollTo({top:0,behavior:'smooth'});return false;\">Back to top \u2191<\/a>\n  <\/div>\n<\/footer>\n", "medical-students-app": "\n<div class=\"navholder\">\n  <nav class=\"site\" aria-label=\"Main\">\n    <a class=\"brand\" href=\"#home\">Adi Elbom.<\/a>\n    <div class=\"navlinks\">\n      <a href=\"#work\">Work<\/a>\n      <a href=\"https://drive.google.com/file/d/1dUDBJgoNw1x8Hw4QgFYmObVrlOSRtjmj/view\" target=\"_blank\" rel=\"noopener\">Resume<\/a>\n      <a class=\"hide-sm\" href=\"https://www.linkedin.com/in/adi-elbom/\" target=\"_blank\" rel=\"noopener\">LinkedIn<\/a>\n      <a class=\"cta\" href=\"https://api.whatsapp.com/send?phone=972507307688\" target=\"_blank\" rel=\"noopener\">Let\u2019s chat<\/a>\n    <\/div>\n  <\/nav>\n<\/div>\n\n<main class=\"wrap\">\n  <header class=\"cs-head\">\n    <p class=\"eyebrow\">Case study \u00b7 Mobile \u00b7 Medical \u00b7 Academy<\/p>\n    <h1><span class=\"lt\">Learning that fits<\/span> <b>between hospital shifts<\/b><\/h1>\n    <p class=\"lede\">A mobile-first app for Sheba Medical Center\u2019s interns: daily updates, exams and assignments, and a library of educational videos in one place.<\/p>\n    <dl class=\"meta\">\n      <div><dt>Role<\/dt><dd>Product Designer<\/dd><\/div>\n      <div><dt>Client<\/dt><dd>Sheba Medical Center<\/dd><\/div>\n      <div><dt>Scope<\/dt><dd>Research, UX, wireframes, UI<\/dd><\/div>\n      <div><dt>Platform<\/dt><dd>Mobile app (B2C)<\/dd><\/div>\n    <\/dl>\n  <\/header>\n\n  <figure class=\"hero-shot bg\" style=\"background-image:url('https://adidamari.co.il/wp-content/uploads/2025/10/Rectangle-312.webp')\"><img src=\"https://adidamari.co.il/wp-content/uploads/2025/10/Sarari-12-scaled.png\" alt=\"Medical students app, three key screens\"><\/figure>\n\n  <section class=\"tldr\">\n    <article><p class=\"eyebrow\">The challenge<\/p><p>Design an intuitive app for people who need important learning content fast. A mobile-first approach makes it even harder.<\/p><\/article>\n    <article><p class=\"eyebrow\">The client<\/p><p>Sheba\u2019s department for interns builds a framework that pairs academic learning with practical training.<\/p><\/article>\n    <article><p class=\"eyebrow\">Impact<\/p><p>21% more mobile sessions, rollouts cut from two weeks to 6 days, and 42% faster content discovery.<\/p><\/article>\n  <\/section>\n\n  <div class=\"story\">\n    <section class=\"chapter reveal\">\n      <p class=\"pill\"><span class=\"n\">01<\/span>Exploring the problem<\/p>\n      <p class=\"statement\">Interns need the <em>right content<\/em>, on their phone, in the few minutes they have.<\/p>\n      <p class=\"support\">We started from a product brief describing the users and potential use cases, and researched similar apps to analyze their structure and audiences.<\/p>\n      <figure class=\"shot\"><img src=\"https://adidamari.co.il/wp-content/uploads/2025/10/Frame-1243666-scaled.webp\" alt=\"Research board\" loading=\"lazy\"><\/figure>\n      <div class=\"phones\" style=\"--n:4\">\n        <img src=\"https://adidamari.co.il/wp-content/uploads/2025/05/IMG_8739.png\" alt=\"Reference app screen\" loading=\"lazy\">\n        <img src=\"https://adidamari.co.il/wp-content/uploads/2025/05/IMG_8737.png\" alt=\"Reference app screen\" loading=\"lazy\">\n        <img src=\"https://adidamari.co.il/wp-content/uploads/2025/05/IMG_8742.png\" alt=\"Reference app screen\" loading=\"lazy\">\n        <img src=\"https://adidamari.co.il/wp-content/uploads/2025/05/IMG_8738.png\" alt=\"Reference app screen\" loading=\"lazy\">\n      <\/div>\n    <\/section>\n\n    <section class=\"chapter sub reveal\">\n      <p class=\"pill\">Market research<\/p>\n      <p class=\"support\">I researched leading learning platforms such as Coursera, Udemy and Domestika, and brought a range of their proven features into our app, to see how the market leaders solve the challenges we faced.<\/p>\n      <div class=\"duo framed\"><div><img src=\"https://adidamari.co.il/wp-content/uploads/2025/10/Frame-%D7%A9%D7%93%D7%A9.png\" alt=\"Competitor analysis\" loading=\"lazy\"><\/div><div><img src=\"https://adidamari.co.il/wp-content/uploads/2025/10/Frame-%D7%A9%D7%93.png\" alt=\"Competitor feature comparison\" loading=\"lazy\"><\/div><\/div>\n    <\/section>\n\n    <section class=\"chapter reveal\">\n      <p class=\"pill\"><span class=\"n\">02<\/span>Wireframing<\/p>\n      <p class=\"statement\">Home, lessons, assignments: the <em>key use cases<\/em> in high fidelity.<\/p>\n      <p class=\"support\">After exploring directions in hand sketches, I detailed the main flows as high-fidelity wireframes.<\/p>\n      <div class=\"screens phones-row\" style=\"--n:3\">\n        <figure><img src=\"https://adidamari.co.il/wp-content/uploads/2025/02/Homepage-All-5.png\" alt=\"Home page wireframe\" loading=\"lazy\"><figcaption><b>Home page<\/b>The most important actions up front, like real-time notifications.<\/figcaption><\/figure>\n        <figure><img src=\"https://adidamari.co.il/wp-content/uploads/2025/02/Homepage-Filter-category-2.png\" alt=\"Filters wireframe\" loading=\"lazy\"><figcaption><b>My activities \u00b7 filters<\/b>Quick searches for activities.<\/figcaption><\/figure>\n        <figure><img src=\"https://adidamari.co.il/wp-content/uploads/2025/02/Homepage-Apply-filter-homepage-wire.png\" alt=\"Filtered results wireframe\" loading=\"lazy\"><figcaption><b>After filtering<\/b>Selected actions and switching between features.<\/figcaption><\/figure>\n        <figure><img src=\"https://adidamari.co.il/wp-content/uploads/2025/02/Lesson-page-Media.png\" alt=\"Lesson page wireframe\" loading=\"lazy\"><figcaption><b>Lesson page<\/b>Lessons, related files, and tasks to complete.<\/figcaption><\/figure>\n        <figure><img src=\"https://adidamari.co.il/wp-content/uploads/2025/02/Lesson-page-Media-details.png\" alt=\"Lesson media wireframe\" loading=\"lazy\"><figcaption><b>Lesson media<\/b>Video and lesson details.<\/figcaption><\/figure>\n        <figure><img src=\"https://adidamari.co.il/wp-content/uploads/2025/02/Lesson-page-Media-2.png\" alt=\"Reference files wireframe\" loading=\"lazy\"><figcaption><b>Reference files<\/b>Save favorite files.<\/figcaption><\/figure>\n        <figure><img src=\"https://adidamari.co.il/wp-content/uploads/2025/02/Lesson-page-Exam-details-chose-answer.png\" alt=\"Lesson assessment wireframe\" loading=\"lazy\"><figcaption><b>Lesson assessment<\/b>A lesson-specific assignment, saved to the lecturers\u2019 admin platform.<\/figcaption><\/figure>\n        <figure><img src=\"https://adidamari.co.il/wp-content/uploads/2025/02/Lesson-page-Exam-result-details.png\" alt=\"Assessment results wireframe\" loading=\"lazy\"><figcaption><b>Assessment results<\/b>Results and answer details.<\/figcaption><\/figure>\n        <figure><img src=\"https://adidamari.co.il/wp-content/uploads/2024/12/Notifications.png\" alt=\"Notifications wireframe\" loading=\"lazy\"><figcaption><b>Notifications<\/b>Real-time updates and additional resources.<\/figcaption><\/figure>\n      <\/div>\n    <\/section>\n\n    <section class=\"chapter reveal\">\n      <p class=\"pill\"><span class=\"n\">03<\/span>The final screens<\/p>\n      <p class=\"statement\">Home page<\/p>\n      <p class=\"support\">The student\u2019s home page shows the latest and most important notifications, plus processes and actions for their enrolled classes. A filter at the top narrows everything by class or lecturer.<\/p>\n      <div class=\"phones\" style=\"--n:4\">\n        <img src=\"https://adidamari.co.il/wp-content/uploads/2025/06/2.png\" alt=\"Home page\" loading=\"lazy\">\n        <img src=\"https://adidamari.co.il/wp-content/uploads/2025/06/Homepage-All1.png\" alt=\"Home page, all activities\" loading=\"lazy\">\n        <img src=\"https://adidamari.co.il/wp-content/uploads/2025/06/Homepage-All1-1.png\" alt=\"Home page, filtered\" loading=\"lazy\">\n        <img src=\"https://adidamari.co.il/wp-content/uploads/2025/05/Homepage-All1-1.png\" alt=\"Home page, detail\" loading=\"lazy\">\n      <\/div>\n    <\/section>\n\n    <section class=\"chapter sub reveal\">\n      <p class=\"statement\">Lesson page<\/p>\n      <p class=\"support\">Each lesson is organized into information, videos and uploaded files, plus a section for tests and online assignments that are part of the physical course.<\/p>\n      <div class=\"phones\" style=\"--n:5\">\n        <img src=\"https://adidamari.co.il/wp-content/uploads/2025/06/1.png\" alt=\"Lesson page\" loading=\"lazy\">\n        <img src=\"https://adidamari.co.il/wp-content/uploads/2025/06/dd.png\" alt=\"Lesson video\" loading=\"lazy\">\n        <img src=\"https://adidamari.co.il/wp-content/uploads/2025/05/Lesson-page-Media-details.png\" alt=\"Lesson media details\" loading=\"lazy\">\n        <img src=\"https://adidamari.co.il/wp-content/uploads/2025/06/Lesson-page-Reference.png\" alt=\"Lesson reference files\" loading=\"lazy\">\n        <img src=\"https://adidamari.co.il/wp-content/uploads/2025/06/Lesson-page-Exam-details-chose-answer.png\" alt=\"Lesson assessment\" loading=\"lazy\">\n      <\/div>\n    <\/section>\n\n    <section class=\"chapter reveal\">\n      <p class=\"pill\"><span class=\"n\">04<\/span>Key outcomes<\/p>\n      <p class=\"statement\">Better mobile access, easier navigation, <em>less admin work<\/em>.<\/p>\n      <ul class=\"results\">\n        <li><span class=\"big-num\">21%<\/span><p class=\"eyebrow\">More mobile sessions<\/p><h3>Mobile sessions surge<\/h3><p>Students access study materials even during hospital shifts.<\/p><\/li>\n        <li><span class=\"big-num\">6d<\/span><p class=\"eyebrow\">Down from two weeks<\/p><h3>Faster feature rollouts<\/h3><p>Fast feedback workshops with developers shortened critical rollouts.<\/p><\/li>\n        <li><span class=\"big-num\">42%<\/span><p class=\"eyebrow\">Faster<\/p><h3>Content discovery<\/h3><p>Task-focused navigation cut the average time to find relevant content.<\/p><\/li>\n      <\/ul>\n    <\/section>\n  <\/div>\n\n  <a class=\"next reveal\" href=\"#nft-admin\">\n    <span class=\"eyebrow\">Next case study<\/span>\n    <span class=\"title\">NFT admin platform<\/span>\n    <span class=\"go\">View case study <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14M13 6l6 6-6 6\"/><\/svg><\/span>\n  <\/a>\n<\/main>\n\n<footer class=\"site-foot\" id=\"contact\">\n  <div class=\"foot-inner\">\n    <div class=\"foot-main\">\n      <h2 class=\"foot-title reveal\"><span class=\"hl\">Let\u2019s Connect.<\/span><\/h2>\n      <div class=\"foot-links\">\n        <a href=\"https://api.whatsapp.com/send?phone=972507307688\" target=\"_blank\" rel=\"noopener\">WhatsApp <span class=\"ext\" aria-hidden=\"true\">\u2197<\/span><\/a>\n        <a href=\"https://www.linkedin.com/in/adi-elbom/\" target=\"_blank\" rel=\"noopener\">LinkedIn <span class=\"ext\" aria-hidden=\"true\">\u2197<\/span><\/a>\n        <a href=\"mailto:adi.elbom3@gmail.com\">Email <span class=\"ext\" aria-hidden=\"true\">\u2197<\/span><\/a>\n      <\/div>\n    <\/div>\n    <div class=\"clock\" id=\"clock\" aria-live=\"off\">\n        <span class=\"clock-icons\" aria-hidden=\"true\">\n          <svg class=\"ci ci-sunrise\" viewBox=\"0 0 32 32\"><path d=\"M4 23h24M9 23a7 7 0 0 1 14 0\"/><path d=\"M16 9v3M7.5 13.5l2 2M24.5 13.5l-2 2M3.5 19h2.5M26 19h2.5\"/><path d=\"M13 6l3-3 3 3\"/><\/svg>\n          <svg class=\"ci ci-sun\" viewBox=\"0 0 32 32\"><circle cx=\"16\" cy=\"16\" r=\"5.5\"/><path d=\"M16 3v3.5M16 25.5V29M3 16h3.5M25.5 16H29M6.8 6.8l2.5 2.5M22.7 22.7l2.5 2.5M6.8 25.2l2.5-2.5M22.7 9.3l2.5-2.5\"/><\/svg>\n          <svg class=\"ci ci-sunset\" viewBox=\"0 0 32 32\"><path d=\"M4 23h24M9 23a7 7 0 0 1 14 0\"/><path d=\"M16 9v3M7.5 13.5l2 2M24.5 13.5l-2 2M3.5 19h2.5M26 19h2.5\"/><path d=\"M13 27l3 3 3-3\"/><\/svg>\n          <svg class=\"ci ci-moon\" viewBox=\"0 0 32 32\"><path d=\"M21.5 20.5A9.5 9.5 0 0 1 11.5 6a10 10 0 1 0 14 13.5 9.4 9.4 0 0 1-4 1Z\"/><path d=\"M23 5.5v3M21.5 7h3M26.5 11v2M25.5 12h2\"/><\/svg>\n        <\/span>\n        <span class=\"clock-label\">Local time \u00b7 Tel Aviv<\/span>\n        <span class=\"clock-time\"><span class=\"hh\">--<\/span><span class=\"colon\">:<\/span><span class=\"mm\">--<\/span><\/span>\n    <\/div>\n  <\/div>\n  <div class=\"foot-bottom\">\n    <span>\u00a9 2026 Adi Elbom Dam Ari \u00b7 Product Designer<\/span>\n    <a href=\"#top\" onclick=\"window.scrollTo({top:0,behavior:'smooth'});return false;\">Back to top \u2191<\/a>\n  <\/div>\n<\/footer>\n"}</script>
<script>
var P=JSON.parse(document.getElementById('pages').textContent),T={"home": "Adi Elbom \u00b7 Product Designer", "nft-admin": "NFT Admin Platform \u00b7 Adi Elbom", "money-transfer-platform": "Money Transfer Platform \u00b7 Adi Elbom", "medical-students-app": "Medical Students App \u00b7 Adi Elbom"};
function reveal(){// Reveal sections as they scroll into view
(function () {
  var els = document.querySelectorAll('.reveal');
  if (!('IntersectionObserver' in window)) { els.forEach(function (e) { e.classList.add('in'); }); return; }
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (en) { if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); } });
  }, { rootMargin: '0px 0px -8% 0px', threshold: 0.05 });
  els.forEach(function (e) { io.observe(e); });
})();

// Floating "Scroll to explore" button: fades out gradually as the visitor scrolls
// (and fades back in if they return to the top); disappears for good once clicked.
(function () {
  var b = document.getElementById('scrollBtn');
  if (!b) return;
  var FADE = 450; // pixels of scrolling to fade out completely
  var clicked = false, ticking = false;
  function update() {
    ticking = false;
    if (clicked) return;
    var o = Math.max(0, 1 - window.scrollY / FADE);
    b.style.opacity = o;
    b.style.pointerEvents = o < 0.1 ? 'none' : '';
    b.style.visibility = o === 0 ? 'hidden' : '';
  }
  function onScroll() { if (!ticking) { ticking = true; requestAnimationFrame(update); } }
  b.addEventListener('click', function (e) {
    e.preventDefault();
    clicked = true;
    window.removeEventListener('scroll', onScroll);
    var w = document.getElementById('work');
    if (w) w.scrollIntoView({ behavior: 'smooth' });
    b.classList.add('gone');
    setTimeout(function () { b.remove(); }, 400);
  });
  window.addEventListener('scroll', onScroll, { passive: true });
  update();
})();

// Live Tel Aviv clock in the footer: time and an icon by time of day
(function () {
  var el = document.getElementById('clock');
  if (!el) return;
  var hh = el.querySelector('.hh'), mm = el.querySelector('.mm');
  var fmt;
  try { fmt = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Jerusalem', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }); }
  catch (e) { return; }
  function tick() {
    var parts = {}; fmt.formatToParts(new Date()).forEach(function (p) { parts[p.type] = p.value; });
    var h = parseInt(parts.hour, 10) % 24;
    hh.textContent = String(h).padStart(2, '0'); mm.textContent = parts.minute;
    var period = h >= 6 && h < 12 ? 'sunrise' : h >= 12 && h < 17 ? 'sun' : h >= 17 && h < 20 ? 'sunset' : 'moon';
    el.setAttribute('data-period', period);
  }
  tick();
  if (window.__clockTimer) clearInterval(window.__clockTimer);
  window.__clockTimer = setInterval(tick, 15000);
})();
}
